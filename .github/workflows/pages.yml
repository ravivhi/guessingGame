# Publishes the Guessing Game (the guessingGame/ folder) with this repo's own GitHub Pages:
#   https://ravivh.com/guessingGame/
# (ravivh.com is the custom domain of ravivhi/ravivhi.github.io, so every repo's Pages site
# is served at ravivh.com/<repo>/. The domain root and .well-known/ live in that repo.)
name: Publish to ravivh.com/guessingGame

on:
  push:
    branches: [main]
    paths: ['guessingGame/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch guessingGame/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guessingGame

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
