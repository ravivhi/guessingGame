# Pulls the alfi game from the public repo ravivhi/alfi (web/ folder) into alfi/
# here, so it's served at https://ravivh.com/alfi/.
#
# Pull model on purpose: ravivhi/alfi holds NO credentials for this repo, so
# alfi collaborators can change only what ends up in alfi/, never anything else here.
name: Sync alfi from ravivhi/alfi

# Manual only: the owner reviews ravivhi/alfi changes, then publishes them with
# Actions → "Sync alfi from ravivhi/alfi" → Run workflow. (alfi collaborators push
# to its main without review, so this click is the approval step for the kids' app.)
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-site   # shared with other syncs so two never push at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Fetch ravivhi/alfi (public, read-only, no credentials)
        run: git clone --depth 1 https://github.com/ravivhi/alfi.git alfi-src

      - name: Copy web/ into alfi/
        run: rsync -a --delete alfi-src/web/ site/alfi/

      - name: Commit, push and rebuild Pages if changed
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A alfi
          if git diff --cached --quiet; then
            echo "alfi is up to date."
            exit 0
          fi
          SRC_SHA=$(git -C ../alfi-src rev-parse --short HEAD)
          SRC_MSG=$(git -C ../alfi-src log -1 --format=%B)
          git config user.name "alfi-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "alfi: sync ravivhi/alfi@$SRC_SHA" -m "$SRC_MSG"
          git push
          # pushes made with GITHUB_TOKEN may not trigger a Pages build, so request one
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
