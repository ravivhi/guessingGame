<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>אלופי האותיות</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D2A5C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Rubik,'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#1565C0 0%,#42A5F5 45%,#90CAF9 100%);background-attachment:fixed;color:#0D2A5C;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit}
#top{height:64px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0D2A5C;border-bottom:5px solid #FFC928;position:relative;z-index:5}
#tbTitle{color:#FFC928;font-weight:900;font-size:clamp(17px,3vw,26px);text-shadow:2px 2px 0 #E53935;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sp{flex:1}
.tb{width:46px;height:46px;flex:none;border-radius:14px;border:3px solid #fff;background:#1E6FD9;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #062048;display:grid;place-items:center;padding:0}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 #062048}
.coins{background:#FFC928;color:#0D2A5C;border:3px solid #fff;border-radius:999px;padding:4px 14px;font-weight:900;font-size:22px;box-shadow:0 4px 0 #B07F00;white-space:nowrap;flex:none}
.coins.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid #FFC928;border-radius:999px;padding:2px 4px 2px 12px;font:800 18px Rubik,Arial;color:#0D2A5C;cursor:pointer;height:50px;flex:none;max-width:200px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{width:42px;height:42px;flex:none}
#view{position:relative;height:calc(100vh - 64px);height:calc(100dvh - 64px);overflow:auto}
.btn{font:800 clamp(17px,2.4vw,22px) Rubik,Arial,sans-serif;border:3px solid #0D2A5C;border-radius:18px;padding:10px 20px;background:#E53935;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0D2A5C;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0D2A5C}
.btn.y{background:#FFC928;color:#0D2A5C}.btn.g{background:#2EB85C}.btn.b{background:#1E6FD9}.btn.w{background:#fff;color:#0D2A5C}.btn.p{background:#8E24AA}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);box-shadow:0 5px 0 #0D2A5C,0 0 0 8px #FFC92888}}
.page{padding:18px;max-width:1150px;margin:0 auto}
.hello{font-size:clamp(26px,4.5vw,44px);font-weight:900;color:#fff;text-shadow:3px 3px 0 #0D2A5C;margin:6px 0 16px;text-align:center}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.card{background:#fff;border:4px solid #0D2A5C;border-radius:24px;box-shadow:0 6px 0 #0D2A5C}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.bounce{animation:bnc .5s}
@keyframes bnc{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}}
/* users */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.ucard{position:relative;background:#fff;border:4px solid #0D2A5C;border-radius:26px;box-shadow:0 7px 0 #0D2A5C;padding:12px;text-align:center;cursor:pointer;transition:transform .12s}
.ucard:hover{transform:translateY(-4px) rotate(-1deg)}
.ucard svg.av{width:150px;height:168px}
.ucard .un{font-size:26px;font-weight:900}
.ucard .uc{font-size:20px;font-weight:800;color:#B07F00}
.ucard .ust{font-size:16px;font-weight:700;color:#1E6FD9}
.ucard.add{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFF8E1;border-style:dashed;min-height:260px}
.ucard .plus{font-size:90px;font-weight:900;color:#E53935;line-height:1}
.udel{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:2px solid #0D2A5C;background:#fff;color:#E53935;font-weight:900;cursor:pointer}
.newu{display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.newu .card{padding:18px}
.newu svg.av{width:220px;height:248px}
.field{margin:12px 0}
.field label{display:block;font-weight:900;font-size:22px;margin-bottom:8px}
.field input{font:800 28px Rubik;border:4px solid #0D2A5C;border-radius:16px;padding:8px 14px;width:min(320px,80vw);color:#0D2A5C}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:50px;height:50px;border-radius:50%;border:4px solid #0D2A5C;cursor:pointer}
.sw button.sel{outline:5px solid #FFC928;transform:scale(1.12)}
.voicewarn{background:#FFF3CD;border:3px solid #E0A800;border-radius:16px;padding:8px 14px;font-weight:700;margin:10px auto;max-width:700px;text-align:center}
/* home */
.hero{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.hero svg.av{width:120px;height:134px;filter:drop-shadow(0 5px 0 #0D2A5C55)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
.ltile{position:relative;aspect-ratio:1;border-radius:24px;background:#fff;border:4px solid #0D2A5C;box-shadow:0 6px 0 #0D2A5C;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.ltile:hover{transform:translateY(-4px) scale(1.03)}
.ltile b{font:900 clamp(48px,7vw,70px)/1 Rubik,Arial;color:var(--c);text-shadow:3px 3px 0 #0D2A5C22}
.ltile .st{font-size:14px;font-weight:800;color:#0D2A5C;margin-top:4px}
.ltile.full{background:#FFF8E1;border-color:#E0A800;box-shadow:0 6px 0 #E0A800}
.ltile.full::after{content:'🏆';position:absolute;top:-10px;left:-8px;font-size:30px}
/* letter page */
.lhead{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.lbig{width:150px;height:150px;font:900 120px/150px Rubik;text-align:center;color:#E53935;cursor:pointer}
.lname{font-size:34px;font-weight:900;color:#fff;text-shadow:2px 2px 0 #0D2A5C}
.lwords{font-size:38px;letter-spacing:6px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gtile{position:relative;background:#fff;border:4px solid #0D2A5C;border-radius:22px;box-shadow:0 6px 0 #0D2A5C;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .12s}
.gtile:hover{transform:translateY(-4px)}
.gtile .gi{font-size:54px;line-height:1.1}
.gtile .gn{font-size:21px;font-weight:900}
.gtile.done::after{content:'⭐';position:absolute;top:-12px;left:-6px;font-size:32px}
/* game frame */
.game{height:100%;display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(255,255,255,.94);border-bottom:4px solid #0D2A5C;min-height:58px}
.gins{font:800 clamp(17px,2.6vw,27px) Rubik;color:#0D2A5C;flex:1}
.gstage{flex:1;position:relative;min-height:0;overflow:hidden}
.gstage.center{display:flex;align-items:center;justify-content:center}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(6,24,60,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
#overlay[hidden]{display:none}
.ovc{background:#fff;border:5px solid #0D2A5C;border-radius:30px;box-shadow:0 10px 0 #0D2A5C;padding:22px 26px;text-align:center;max-width:620px;width:100%;animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}}
.ovc h2{font-size:clamp(32px,6vw,52px);margin:4px 0;color:#E53935;text-shadow:3px 3px 0 #FFC928}
.ovc .trophy{font-size:80px;animation:bnc 1s infinite}
.ovc .earn{font-size:40px;font-weight:900;color:#B07F00}
.ovc .first{font-size:22px;font-weight:800;color:#1E6FD9}
.ovc p{font-size:22px;font-weight:700}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.flycoin{position:fixed;font-size:34px;z-index:31;pointer-events:none;transition:transform .9s cubic-bezier(.5,-.4,.6,1),opacity .9s}
/* trace */
.tracewrap,.colwrap{display:flex;flex-direction:column;align-items:center}
svg.board{touch-action:none;filter:drop-shadow(0 6px 0 rgba(13,42,92,.35))}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.9);opacity:.8}100%{transform:scale(2.1);opacity:0}}
/* color */
.cboard{position:relative;border-radius:26px;filter:drop-shadow(0 6px 0 rgba(13,42,92,.35))}
.cboard canvas{position:absolute;left:0;top:0;touch-action:none}
.cboard canvas:nth-child(3){pointer-events:none}
.pots{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.pot{width:52px;height:52px;border-radius:50%;border:4px solid #0D2A5C;box-shadow:inset -6px -6px 0 rgba(0,0,0,.18),inset 6px 6px 0 rgba(255,255,255,.35),0 4px 0 #0D2A5C;cursor:pointer;transition:transform .15s}
.pot.sel{transform:translateY(-8px) scale(1.12);outline:5px solid #FFC928}
.cbar{width:min(420px,80%);height:18px;background:#fff;border:3px solid #0D2A5C;border-radius:999px;overflow:hidden;margin-top:10px}
.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2EB85C,#FFC928);transition:width .3s}
/* lesson */
.gstage.lesson{display:flex;flex-direction:column}
.lbar{padding:8px 16px}
.lprog{height:16px;background:#fff;border:3px solid #0D2A5C;border-radius:999px;overflow:hidden}
.lprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC928,#E53935);transition:width .4s}
.lslide{flex:1;position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.lnav{display:flex;justify-content:space-between;padding:8px 16px 12px}
.meet .bigL{font:900 min(36vh,240px)/1.1 Rubik;color:#E53935;-webkit-text-stroke:5px #0D2A5C;cursor:pointer;text-align:center;background:#fff;border:5px solid #0D2A5C;border-radius:40px;box-shadow:0 8px 0 #0D2A5C;padding:0 50px}
.meet .lname{text-align:center;margin-top:14px}
.wcards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.wcard{position:relative;width:min(200px,40vw);background:#fff;border:4px solid #0D2A5C;border-radius:24px;box-shadow:0 6px 0 #0D2A5C;text-align:center;padding:10px;cursor:pointer}
.wcard .em{font-size:clamp(56px,10vh,90px);line-height:1.2}
.wcard .w{font-size:30px;font-weight:900}
.wcard .w span{color:#E53935}
.wcard.ok{background:#C8F7D4;border-color:#2EB85C}
.wcard.ok::after{content:'✔';position:absolute;top:4px;left:10px;color:#2EB85C;font-size:30px;font-weight:900}
.pzpiece{position:absolute;border:3px solid #0D2A5C;border-radius:10px;box-shadow:0 5px 10px rgba(0,0,0,.25);cursor:grab;touch-action:none;background-repeat:no-repeat;z-index:3}
.pzpiece.locked{box-shadow:none;border-color:transparent;cursor:default;z-index:1;border-radius:0}
.pzslot{position:absolute;border:3px dashed #0D2A5C88;background:rgba(255,255,255,.55)}
.ftile{width:min(100px,20vw);aspect-ratio:1;display:grid;place-items:center;font:900 clamp(44px,8vh,64px) Rubik;background:#fff;border:4px solid #0D2A5C;border-radius:20px;box-shadow:0 5px 0 #0D2A5C;cursor:pointer}
.ftile.ok{background:#C8F7D4;border-color:#2EB85C;color:#2EB85C!important}
.fgrid{display:grid;grid-template-columns:repeat(4,auto);gap:12px}
/* niqqud sounds */
.nq{font-family:Arial,'Segoe UI',Tahoma,sans-serif}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 12px;font-size:30px;font-weight:900;color:#fff;text-shadow:2px 2px 0 #0D2A5C}
.sechead .nq{background:#fff;color:#0D2A5C;border:3px solid #0D2A5C;border-radius:14px;padding:0 12px 6px;text-shadow:none;font-size:38px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #0D2A5C}
.sgame{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;height:100%;padding:10px}
.bigspk{width:110px;height:110px;flex:none;border-radius:50%;border:5px solid #0D2A5C;background:#FFC928;font-size:54px;cursor:pointer;box-shadow:0 7px 0 #0D2A5C}
.bigspk:active{transform:translateY(5px);box-shadow:0 2px 0 #0D2A5C}
.bigspk.play{animation:bnc .6s}
.sopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:min(900px,96%)}
.sopts.sboard{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.sopts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sopt{background:#fff;border:5px solid #0D2A5C;border-radius:26px;box-shadow:0 7px 0 #0D2A5C;font-family:Arial,'Segoe UI',Tahoma,sans-serif;font-size:clamp(56px,10vh,104px);font-weight:700;line-height:1.3;color:#0D2A5C;cursor:pointer;text-align:center;padding:4px 0 14px}
.sopt small{display:block;font:800 18px Rubik,Arial;color:#1E6FD9;line-height:1.1}
.sopt.ok{background:#C8F7D4;border-color:#2EB85C;box-shadow:0 7px 0 #2EB85C}
.sopt.no{background:#FFCDD2}
.brow{display:flex;align-items:center;gap:30px}
.bbox{min-width:190px;height:210px;display:grid;place-items:center;background:#fff;border:6px dashed #0D2A5C;border-radius:30px;font-size:140px;font-weight:700;color:#E53935;padding:0 20px 20px;line-height:1.3}
.bbox.ok{border-style:solid;border-color:#2EB85C;background:#C8F7D4}
.bbox.no{background:#FFCDD2;animation:shake .4s}
.vtiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;width:min(900px,96%)}
@media (max-width:700px){.vtiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.vtile{background:#fff;border:4px solid #0D2A5C;border-radius:20px;box-shadow:0 5px 0 #0D2A5C;font-size:60px;font-weight:700;line-height:1.25;cursor:pointer;color:#1E6FD9;padding:2px 0 8px;text-align:center}
.vtile small{display:block;font:800 16px Rubik,Arial;color:#0D2A5C}
.spkfloat{position:absolute;left:12px;bottom:12px;z-index:7;width:72px;height:72px;font-size:36px;border-radius:50%}
/* arenas */
.arena{position:absolute;inset:0;overflow:hidden;touch-action:none}
.hud{position:absolute;top:8px;right:8px;left:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:6;pointer-events:none;flex-wrap:wrap}
.hudbox{background:#fff;border:3px solid #0D2A5C;border-radius:16px;padding:4px 12px;font:900 clamp(16px,2.4vw,22px) Rubik;box-shadow:0 4px 0 #0D2A5C;display:flex;align-items:center;gap:8px}
.slots{display:flex;gap:4px}
.slots i{width:30px;height:30px;border-radius:50%;border:3px dashed #0D2A5C;background:#fff;display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:900}
.slots i.full{background:#FFC928;border-style:solid;animation:bnc .5s}
.cloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;top:-26px;left:18px}.cloud::after{width:40px;height:40px;top:-16px;left:62px}
@keyframes drift{from{left:110%}to{left:-30%}}
.plane{position:absolute;left:0;top:0;width:130px;z-index:4;pointer-events:none}
.balloon{position:absolute;left:0;top:0;width:78px;pointer-events:none;z-index:3}
.balloon .bb{width:78px;height:90px;border-radius:50% 50% 46% 46%;border:3px solid #0D2A5C;display:grid;place-items:center;font-size:50px;font-weight:900;color:#0D2A5C;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.4);line-height:1}
.balloon .str{width:2px;height:26px;background:#0D2A5C;margin:0 auto}
.balloon.pop .bb{animation:popb .3s forwards}
.balloon.bad .bb{background:#E53935!important;animation:shake .35s}
@keyframes popb{to{transform:scale(1.8);opacity:0}}
/* mole */
.mfield{position:absolute;inset:0;background:linear-gradient(#81D4FA 0,#B3E5FC 22%,#7CB342 22%,#558B2F 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:40px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,22px);width:min(660px,94%)}
.hole{position:relative;height:clamp(105px,21vh,175px);overflow:hidden;cursor:pointer}
.hole .pit{position:absolute;left:4%;right:4%;bottom:6%;height:30%;background:#3E2723;border-radius:50%}
.hole .mole{position:absolute;left:14%;right:14%;bottom:12%;top:4%;transform:translateY(110%);transition:transform .25s ease;z-index:1}
.hole.up .mole{transform:translateY(0)}
.hole.gone .mole{transform:translateY(115%);transition:transform .45s ease-in}
.hole .mole svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%}
.hole .sign{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;border:3px solid #0D2A5C;border-radius:14px;font:900 clamp(30px,5.5vh,52px)/1.15 Rubik;padding:0 14px;color:#0D2A5C;z-index:2}
.hole .front{position:absolute;left:0;right:0;bottom:0;height:16%;background:#6D4C41;border-radius:50% 50% 12px 12px/70% 70% 12px 12px;z-index:3;border-top:4px solid #8D6E63}
.hole.no .sign{background:#FFCDD2;animation:shake .4s}
.hole.hit .sign{background:#C8F7D4}
.bonk{position:fixed;font-size:54px;pointer-events:none;z-index:25;animation:bonk .4s forwards}
@keyframes bonk{0%{transform:translate(-50%,-80%) rotate(30deg)}50%{transform:translate(-50%,-60%) rotate(-30deg)}100%{transform:translate(-50%,-60%) rotate(-30deg);opacity:0}}
/* match */
.mtgrid{display:grid;gap:10px;margin:auto}
.mtc{aspect-ratio:1;background:#fff;border:4px solid #0D2A5C;border-radius:18px;box-shadow:0 5px 0 #0D2A5C;cursor:pointer;padding:4px;transition:transform .15s,opacity .4s}
.mtc svg{width:100%;height:100%;display:block}
.mtc.sel{transform:scale(1.07);border-color:#E53935;box-shadow:0 5px 0 #E53935}
.mtc.ok{background:#C8F7D4;border-color:#2EB85C;animation:bnc .5s}
.mtc.gone{transform:scale(.2);opacity:0;pointer-events:none}
.mtc.no{animation:shake .4s;border-color:#E53935}
.dots{display:flex;gap:8px;justify-content:center;padding:8px}
.dots i{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #0D2A5C}
.dots i.on{background:#FFC928}
/* drive/race/jump */
.drsv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
canvas.full{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:8;background:rgba(6,24,60,.35);padding:12px}
.intro .card{padding:18px 24px;text-align:center;max-width:560px}
.intro h3{font-size:clamp(26px,4vw,38px);margin:4px 0;color:#E53935}
.intro p{font-size:22px;font-weight:800;margin:6px 0}
.tgt{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#FFC928;border:4px solid #0D2A5C;font:900 42px Rubik;vertical-align:middle}
.cars{display:flex;gap:14px;justify-content:center;margin:12px 0}
.cars button{width:86px;height:70px;border-radius:16px;border:4px solid #0D2A5C;background:#E3F2FD;cursor:pointer}
.cars button.sel{background:#FFC928;transform:scale(1.1)}
.mapdots{display:flex;gap:30px;justify-content:center;align-items:center;margin:16px 0;position:relative;height:80px}

 function render(){c.setTransform(dpr*k,0,0,dpr*k,0,0);const g=c.createLinearGradient(0,0,0,420);g.addColorStop(0,'#FF8A65');g.addColorStop(.45,'#FFCC80');g.addColorStop(1,'#FFF3E0');c.fillStyle=g;c.fillRect(0,0,VW,420);
