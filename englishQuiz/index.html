<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4a00e0">
    <title>בוחן באנגלית - אליפות!</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="בוחן באנגלית">
    <meta property="og:image" content="https://ravivh.com/englishQuiz/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://ravivh.com/englishQuiz/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://ravivh.com/englishQuiz/preview.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* no pull-to-refresh: swiping down must not reload the page */
        html, body {
            overscroll-behavior-y: none;
        }

        /* The page itself never scrolls: it is exactly one screen high, the card fits inside it and
           only the words table scrolls (see .words-box). margin:auto centres the card and, unlike
           align-items:center, keeps it reachable if a very short screen makes it taller than the page. */
        body {
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            display: flex;
            height: 100vh;
            height: 100dvh;
            color: #333;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            min-width: 0;
            margin: auto;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
        }

        /* start screen: everything keeps its size, the words box takes the remaining height */
        #start-screen {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
        }
        #start-screen > * { flex: none; }
        #start-screen > .words-box {
            flex: 1 1 auto;
            min-height: 96px;
            overflow: auto;
        }


        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .score-box {
            color: #2b6cb0;
        }

        .timer-box {
            color: #dd6b20;
        }

        .progress-box {
            font-size: 0.9rem;
            color: #718096;
        }

        .question-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #1a202c;
        }

        .instruction-text {
            font-size: 1rem;
            color: #718096;
            margin-bottom: 20px;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn-answer {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            background-color: #edf2f7;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.15s, transform 0.1s, border-color 0.15s;
            touch-action: manipulation;
        }

        .btn-answer:active {
            transform: scale(0.98);
        }

        .btn-answer.correct {
            background-color: #48bb78 !important;
            border-color: #38a169 !important;
            color: white;
        }

        .btn-answer.wrong {
            background-color: #f56565 !important;
            border-color: #e53e3e !important;
            color: white;
        }

        .summary-screen {
            display: none;
        }

        .emoji-animation {
            font-size: 5rem;
            margin: 20px 0;
            display: inline-block;
            animation: bounce 0.8s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .bonus-badge {
            background-color: #feebc8;
            color: #c05621;
            padding: 10px 15px;
            border-radius: 30px;
            display: inline-block;
            font-weight: bold;
            margin: 15px 0;
            border: 1px dashed #dd6b20;
        }

        /* the two modes of the start screen: random words / words from a picture */
        .tabs { display: flex; gap: 6px; margin: 2px 0 8px; }
        .tab-btn {
            flex: 1;
            padding: 9px 6px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #edf2f7;
            color: #4a5568;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .tab-btn[aria-selected="true"] {
            background: #3182ce;
            border-color: #3182ce;
            color: #fff;
            box-shadow: 0 2px 4px rgba(50,130,206,0.35);
        }
        .tab-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* a big emoji at the top of the quiz: gets happier every 5 first-try answers in a row.
           It takes no room until it appears, then it slides open above the header. */
        #streak-emoji {
            width: fit-content;   /* only as wide as the emoji, so the pop animation can never widen the page */
            height: 0;
            margin: 0 auto;
            overflow: hidden;
            font-size: clamp(3rem, 9vh, 5rem);
            line-height: 1.15;
            text-align: center;
            opacity: 0;
            transition: height 0.3s, margin 0.3s, opacity 0.35s;
            pointer-events: none;
            user-select: none;
        }
        #streak-emoji.on { height: 1.15em; margin: 0 auto 8px; opacity: 1; overflow: visible; }
        #streak-emoji.pop { animation: streakPop 0.75s ease-out; }
        @keyframes streakPop {
            0%   { transform: scale(0.2) rotate(-15deg); }
            60%  { transform: scale(1.18) rotate(6deg); }
            100% { transform: scale(1) rotate(0); }
        }

        /* the small grey action buttons on the start screen (add / clear / random words / photo) */
        .action-btn {
            padding: 8px 12px;
            font-size: 0.95rem;
            background: #e2e8f0;
            color: #2d3748;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .action-btn:active {
            background: #cbd5e0;
            box-shadow: none;
            transform: translateY(1px);
        }

        /* message lines take no space until they have text */
        #photo-status:empty, #start-error:empty, #words-hint:empty, #random-status:empty { display: none; }

        .btn-restart:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-restart {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 1.3rem;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(50,130,206,0.3);
        }

        /* Small screens. Keep these LAST: they must come after the base rules above to override them. */
        @media (max-width: 360px) {
            .game-container { padding: 14px; }
            /* narrow phones: slightly smaller buttons (all of them, so they keep one look) so the longer
               random-words label still shares a line with the level picker and the tab names stay on one line */
            .action-btn { font-size: 0.85rem; padding: 8px 8px; }
            #level-select { font-size: 0.85rem; padding: 7px 4px; }
            .tab-btn { font-size: 0.85rem; padding: 9px 4px; }
        }
        /* short phones: tighter big buttons / emoji so the result screen fits without page scrolling */
        @media (max-height: 700px) {
            .btn-restart { margin-top: 12px; padding: 11px 32px; font-size: 1.15rem; }
            .emoji-animation { font-size: 3.2rem; margin: 8px 0; }
            .result-title { margin-bottom: 8px; }
            .summary-screen p { margin: 6px 0 !important; }
        }
        @media (max-height: 620px) {
            .game-container { padding: 14px; }
            .btn-restart { margin-top: 8px; padding: 9px 28px; font-size: 1.05rem; }
            .emoji-animation { font-size: 2.6rem; margin: 4px 0; }
            .summary-screen #summary-stats { font-size: 1.05rem !important; }
            .summary-screen #summary-final-score { font-size: 1.25rem !important; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div id="start-screen">
            <div class="result-title" style="margin-bottom:10px;">בוחן באנגלית</div>
            <div id="grand-total" style="font-weight:bold;color:#2b6cb0;margin:-4px 0 6px;"></div>
            <div class="tabs" role="tablist">
                <button type="button" role="tab" id="tab-random" class="tab-btn" aria-selected="true" onclick="setMode('random')">🎲 מילים אקראיות</button>
                <button type="button" role="tab" id="tab-picture" class="tab-btn" aria-selected="false" onclick="setMode('picture')">📷 מתמונה</button>
            </div>
            <div id="panel-random" role="tabpanel">
                <div style="display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0;">
                    <button type="button" id="random-btn" class="action-btn" onclick="randomWords()">🎲 לחץ ל20 מילים אקראיות</button>
                    <select id="level-select" aria-label="רמת קושי" title="רמת קושי: 1 קלה ... 10 קשה" onchange="saveLevel()" style="padding:7px 6px;font-size:0.95rem;border:1px solid #cbd5e0;border-radius:8px;background:#fff;color:#2d3748;">
                        <option value="1">רמה 1</option><option value="2">רמה 2</option><option value="3">רמה 3</option><option value="4">רמה 4</option><option value="5">רמה 5</option>
                        <option value="6">רמה 6</option><option value="7">רמה 7</option><option value="8">רמה 8</option><option value="9">רמה 9</option><option value="10">רמה 10</option>
                    </select>
                </div>
                <div id="random-status" style="margin:2px 0 4px;font-size:0.9rem;color:#2b6cb0;"></div>
            </div>
            <div id="panel-picture" role="tabpanel" style="display:none;">
                <input type="file" id="photo-input" accept="image/*" multiple style="display:none;">
                <button type="button" id="photo-btn" class="action-btn" onclick="document.getElementById('photo-input').click()" style="margin:4px 0;">📷 קריאת מילים מתמונה</button>
                <div id="photo-status" style="margin:4px 0 4px;font-size:0.9rem;color:#2b6cb0;"></div>
            </div>
            <p style="margin:6px 0;">בכל שורה: מילה באנגלית ופירוש.</p>
            <textarea id="words-input" hidden></textarea>
            <div id="words-count" style="margin:10px 0 4px;font-size:0.9rem;color:#4a5568;min-height:1.3em;"></div>
            <div id="words-hint" style="margin:0 0 4px;font-size:0.8rem;color:#975a16;"></div>
            <div class="words-box" style="border:2px solid #ccc;border-radius:10px;">
                <table id="words-table" style="width:100%;table-layout:fixed;border-collapse:collapse;direction:ltr;"></table>
            </div>
            <div style="margin:8px 0;display:flex;gap:8px;justify-content:center;">
                <button type="button" class="action-btn" onclick="addWordRow()" style="flex:1;">➕ הוספת מילה</button>
                <button type="button" class="action-btn" onclick="clearWords()" style="flex:1;">🗑️ ניקוי המילים</button>
            </div>
            <div id="start-error" style="color:#c53030;margin-top:6px;"></div>
            <button class="btn-restart" id="start-btn" onclick="startFromInput()" style="margin-top:12px;">התחל משחק</button>
        </div>

        <div id="game-screen" style="display:none;">
            <div id="streak-emoji" aria-hidden="true"></div>
            <div class="header-info">
                <button type="button" id="back-btn" class="action-btn" onclick="leaveGame()" aria-label="חזרה לתפריט הראשי" title="חזרה לתפריט הראשי" style="padding:5px 10px;font-size:0.9rem;">→ תפריט</button>
                <div class="score-box">נקודות: <span id="score">0</span></div>
                <div class="progress-box">שאלה: <span id="current-progress">1</span>/<span id="total-progress">0</span></div>
            </div>
            
            <div class="instruction-text">מה הפירוש הנכון של המילה:</div>
            <div style="display:flex;align-items:center;justify-content:center;gap:10px;">
                <div class="question-text" id="question-word" dir="ltr">Word</div>
                <button type="button" id="speak-btn" onclick="speakWord()" aria-label="השמעת המילה" title="השמעת המילה" style="font-size:1.6rem;line-height:1;padding:6px 10px;margin-bottom:5px;background:#e2e8f0;border:none;border-radius:50%;cursor:pointer;">🔊</button>
            </div>
            
            <div class="answers-grid" id="answers-container"></div>
        </div>

        <div id="summary-screen" class="summary-screen">
            <div class="emoji-animation" id="summary-emoji">🏆</div>
            <div class="result-title" id="summary-title">וואו! אתם פשוט אלופים!</div>
            <div id="bonus-container"></div>
            <p style="font-size: 1.3rem; margin: 10px 0;" id="summary-stats">צדקתם ב-0 מתוך 0 מילים</p>
            <p style="font-size: 1.5rem; font-weight: bold; color: #2b6cb0;" id="summary-final-score">ציון סופי: 0</p>
            <button class="btn-restart" onclick="restartGame()">נסו שוב</button>
            <button class="btn-restart" id="practice-missed-btn" style="display:none;margin-top:10px;background:#dd6b20;" onclick="practiceMissed()">תרגול המילים שטעיתי</button>
            <button class="btn-restart" id="all-words-btn" style="display:none;margin-top:10px;background:#718096;" onclick="playAll()">כל המילים</button>
            <button class="btn-restart" style="margin-top:10px;background:#718096;" onclick="showStart()">החלפת מילים</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
    <script>
        let wordsData = [];
        let fullWords = [];   // the whole list from the start screen (wordsData is a subset while practising missed words)
        let missed = [];      // words answered wrong at least once in the current round
        // Two modes (the tabs), each with its own word list kept on the device:
        //   random  - words picked from the built-in word bank (default tab)
        //   picture - words typed by hand or read from a photo (keeps the old key, so an older saved list shows up here)
        const MODE_KEY = 'englishquiz-mode';
        const LIST_KEYS = { random: 'englishquiz-words-random', picture: 'englishquiz-words' };
        let mode = 'random';
        try { const m = localStorage.getItem(MODE_KEY); if (m === 'random' || m === 'picture') mode = m; } catch (e) {}
        const storeKey = () => LIST_KEYS[mode];
        function readList(m) {
            let t = "";
            try { t = localStorage.getItem(LIST_KEYS[m]) || (m === "picture" ? localStorage.getItem('englishpractice-words') : "") || ""; } catch (e) {}
            return t.replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "");
        }

        let currentIndex = 0;
        let totalScore = 0;
        let correctFirstTryCount = 0;
        
        // Scoring: +1 for a word answered right on the first try, -1 for a word missed on the first try,
        // +1 bonus for a round of 10+ words with no mistakes.
        // A round never ends below 0, and the points add up from game to game (saved on the device).
        const TOTAL_KEY = 'englishquiz-total-points';
        let grandTotal = 0;
        try { grandTotal = Math.max(0, parseInt(localStorage.getItem(TOTAL_KEY), 10) || 0); } catch (e) {}
        let wrongCount = 0;
        let canAnswer = true;
        let nextQuestionTimer = null;   // the short pause after a right answer, before the next question

        // A big emoji appears behind the quiz after 5 answers in a row that were right on the first try, and a
        // happier one every 5 more for the first 10 emojis, every 10 for emojis 11-20, every 15 for 21-30 (30 emojis
        // = a streak of 300). One wrong first try halves the streak (rounded down).
        // The streak carries on into the next round and through the menu; only a wrong first try lowers it.
        // 30 emojis that look clearly different from each other (no near-twins like 😀 / 😃): faces from a slight
        // smile up to 😻 at 75, then 🤗 😉 😸 🤑 💯 and celebration symbols up to 👑 at a streak of 300.
        const STREAK_EMOJIS = ["🙂", "😊", "😄", "😆", "😎", "😍", "🥰", "🤩", "😂", "😋", "🥳", "🤪", "🤠", "😇", "😻",
                               "🤗", "😉", "😸", "🤑", "💯", "🔥", "🌈", "🦄", "🌟", "🚀", "🦸", "💎", "🏆", "🐲", "👑"];
        // Emojis 1-10 come every 5 right answers (5..50), 11-20 every 10 (60..150), 21-30 every 15 (165..300).
        function streakThreshold(n) { return n <= 10 ? 5 * n : n <= 20 ? 50 + 10 * (n - 10) : 150 + 15 * (n - 20); }
        function streakStage(s) {
            let stage = 0;
            while (stage < STREAK_EMOJIS.length && streakThreshold(stage + 1) <= s) stage++;
            return stage;
        }
        let streak = 0, shownStage = 0;
        function updateStreakEmoji() {
            const el = document.getElementById("streak-emoji");
            const stage = streakStage(streak);
            if (stage === shownStage) return;
            shownStage = stage;
            if (stage === 0) { el.classList.remove("on", "pop"); return; }   // a mistake: the emoji fades away
            el.textContent = STREAK_EMOJIS[stage - 1];
            el.classList.add("on");
            el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");   // pop in
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function loadQuestion() {
            document.getElementById("total-progress").innerText = wordsData.length;
            
            if (currentIndex >= wordsData.length) {
                showSummary();
                return;
            }

            canAnswer = true;
            wrongCount = 0;
            document.getElementById("current-progress").innerText = currentIndex + 1;

            const currentData = wordsData[currentIndex];
            document.getElementById("question-word").innerText = currentData.word;

            let allAnswers = [currentData.correct, ...currentData.dynamics];
            allAnswers = shuffle(allAnswers);

            const container = document.getElementById("answers-container");
            container.innerHTML = "";

            allAnswers.forEach(ans => {
                const button = document.createElement("button");
                button.className = "btn-answer";
                button.innerText = ans;
                button.onclick = () => handleAnswer(button, ans, currentData.correct);
                container.appendChild(button);
            });
        }

        function handleAnswer(selectedButton, selectedAnswer, correctAnswer) {
            if (!canAnswer) return;

            if (selectedAnswer === correctAnswer) {
                canAnswer = false;
                selectedButton.classList.add("correct");

                if (wrongCount === 0) { totalScore += 1; correctFirstTryCount++; streak++; updateStreakEmoji(); }
                document.getElementById("score").innerText = totalScore;

                nextQuestionTimer = setTimeout(() => {
                    nextQuestionTimer = null;
                    currentIndex++;
                    loadQuestion();
                }, 500);

            } else {
                selectedButton.classList.add("wrong");
                selectedButton.disabled = true;
                if (wrongCount === 0) { totalScore -= 1; streak = Math.floor(streak / 2); updateStreakEmoji(); }
                wrongCount++;
                document.getElementById("score").innerText = totalScore;
                const cur = wordsData[currentIndex];
                if (!missed.includes(cur)) missed.push(cur);
            }
        }

        function showSummary() {
            document.getElementById("game-screen").style.display = "none";
            const summaryScreen = document.getElementById("summary-screen");
            summaryScreen.style.display = "block";

            const totalWords = wordsData.length;
            const successRate = (correctFirstTryCount / totalWords) * 100;

            let emoji = "💪";
            let title = "כל הכבוד על המאמץ!";
            
            if (successRate >= 90) {
                emoji = "🏆";
                title = "וואו! אתם פשוט אלופים!";
            } else if (successRate >= 70) {
                emoji = "⭐";
                title = "עבודה מצוינת!";
            }

            const bonusContainer = document.getElementById("bonus-container");
            bonusContainer.innerHTML = "";
            // Bonus only for a quiz of at least 10 words, all answered right on the first try
            if (totalWords >= 10 && correctFirstTryCount === totalWords) {
                totalScore += 1;
                const bonusBadge = document.createElement("div");
                bonusBadge.className = "bonus-badge";
                bonusBadge.innerText = "💥 מטורף! נקודת בונוס על בוחן בלי טעויות!";
                bonusContainer.appendChild(bonusBadge);
            }
            totalScore = Math.max(0, totalScore);
            grandTotal += totalScore;
            try { localStorage.setItem(TOTAL_KEY, String(grandTotal)); } catch (e) {}
            showGrandTotal();

            document.getElementById("summary-emoji").innerText = emoji;
            document.getElementById("summary-title").innerText = title;
            document.getElementById("summary-stats").innerText = `צדקתם בניסיון ראשון ב-${correctFirstTryCount} מתוך ${totalWords} מילים`;
            document.getElementById("summary-final-score").innerText = `נקודות בבוחן: ${totalScore} · סה״כ: ${grandTotal}`;

            const practiceBtn = document.getElementById("practice-missed-btn");
            practiceBtn.style.display = missed.length ? "" : "none";
            practiceBtn.innerText = `תרגול המילים שטעיתי (${missed.length})`;
            document.getElementById("all-words-btn").style.display = wordsData !== fullWords ? "" : "none";
        }

        // "→ תפריט" in the middle of a quiz: back to the main menu. The round is abandoned, so its points
        // are not added to the total (they are only added when a round is finished).
        async function leaveGame() {
            // freeze the quiz while the question is open (a right answer may be about to move on to the next word)
            const pending = nextQuestionTimer !== null, couldAnswer = canAnswer;
            clearTimeout(nextQuestionTimer); nextQuestionTimer = null;
            canAnswer = false;
            const leave = await askConfirm("לחזור לתפריט הראשי? הנקודות והתקדמות הבוחן הנוכחי לא יישמרו.", "חזרה לתפריט");
            if (!leave) {   // carry on where we were
                if (pending) { currentIndex++; loadQuestion(); } else canAnswer = couldAnswer;
                return;
            }
            try { speechSynthesis.cancel(); } catch (e) {}

        const CATS = {
            months: "january february march april may june july august september october november december".split(" "),
            days: "sunday monday tuesday wednesday thursday friday saturday".split(" "),
            numbers: "zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand a hundred".split(" ").concat(["a hundred"]),
            family: "mother father mom dad brother sister grandmother grandfather grandma grandpa aunt uncle cousin son daughter baby parents family".split(" "),
            animals: "animal dog cat horse cow sheep lion tiger elephant monkey bird fish rabbit mouse bear wolf turtle penguin kitten puppy duck chicken pig giraffe snake frog".split(" "),
            food: "cake candy bread milk cheese apple banana egg rice flour sugar salt pizza chocolate cookie ice cream sandwich soup meat fruit vegetable juice water".split(" "),
            house: "bathroom bedroom kitchen classroom dining room living room toilet bath floor wall roof door window sofa table chair bed flat building house garden".split(" "),
            colors: "red blue green yellow orange purple pink black white brown gray grey".split(" "),
            body: "head face eye ear nose mouth hand arm leg foot feet finger hair tooth teeth".split(" "),
            feelings: "happy sad angry scared tired hungry thirsty sorry sick excited bored".split(" "),
            music: "guitar piano song drum violin music sing hobby".split(" "),
            languages: "arabic hebrew english russian french spanish".split(" "),
            time: "year month week day hour minute second today tomorrow yesterday soon then when".split(" "),
            school: "student teacher subject study teach class book pen pencil school".split(" "),
            places: "market village beach farm hospital park city street israel outside".split(" ")
        };
        function catOf(word) {
            const w = word.toLowerCase().replace(/\(\w+\)/g, "").trim();
            for (const k in CATS) if (CATS[k].includes(w)) return k;
            return null;
        }

        const FALLBACK = "שולחן כיסא ספר חלון דלת בית כלב חתול מכונית עץ פרח שמש ירח כוכב נהר ים הר לחם חלב תפוח מים לרוץ ללכת לאכול לשתות לישון לכתוב לקרוא לשחק לשיר לצחוק לבכות לקפוץ לצייר לפתוח לסגור גדול קטן מהיר איטי חם קר חדש ישן".split(" ");

        function parseWords(text) {
            const rows = text.replace(/^\uFEFF/, '').split(/\r?\n/)
                .map(l => (l.includes("\t") ? l.split("\t") : l.split(/[,;]/)).map(x => x.replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "").trim()).filter(x => x))
                .filter(r => r.length >= 2);
            const pool = [], seen = new Set();
            for (const r of rows) {
                if (!seen.has(r[1])) { seen.add(r[1]); pool.push({ t: r[1], cat: catOf(r[0]), verb: r[1].startsWith("ל") }); }
            }
            for (const t of FALLBACK) if (!seen.has(t)) { seen.add(t); pool.push({ t, cat: null, verb: t.startsWith("ל") }); }
            const out = [];
            for (const r of rows) {
                const cat = catOf(r[0]), verb = r[1].startsWith("ל");
                const dynamics = [...new Set(r.slice(2))].filter(x => x !== r[1]).slice(0, 3);
                const score = x => (cat && x.cat === cat ? 4 : 0) + (x.verb === verb ? 2 : 0) + (!cat && !x.cat ? 1 : 0);
                const extra = shuffle(pool.filter(x => x.t !== r[1] && !dynamics.includes(x.t))).sort((p, q) => score(p) - score(q));
                while (dynamics.length < 3 && extra.length) dynamics.push(extra.pop().t);
                if (dynamics.length < 3) return { error: 'צריך לפחות 4 פירושים שונים (או 3 טעויות בכל שורה).' };
                out.push({ word: r[0], correct: r[1], dynamics });
            }
            if (!out.length) return { error: 'לא נמצאו מילים. פורמט: מילה, פירוש' };
            return { words: out };
        }

        function beginGame(words) {
            wordsData = fullWords = words;

            restartGame();

        function startFromInput() {
            if (rows.some(r => !r.en.trim() !== !r.he.trim())) { document.getElementById("start-error").innerText = 'יש שורות שחסרים בהן מילה או פירוש.'; return; }
            const text = document.getElementById("words-input").value;
            const res = parseWords(text);
            if (res.error) { document.getElementById("start-error").innerText = res.error; return; }
            document.getElementById("words-input").value = text.replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "");
            renderWords();
            try { localStorage.setItem(storeKey(), document.getElementById("words-input").value); } catch (e) {}
            document.getElementById("start-error").innerText = "";
            beginGame(res.words);
        }

        // In-app confirm dialog (the browser's confirm() shows the site's address)
        function askConfirm(text, okText) {
            return new Promise(resolve => {
                const bg = document.createElement("div");
                bg.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;";
                bg.innerHTML = `<div dir="rtl" style="background:#fff;color:#1a202c;border-radius:16px;padding:22px 20px 16px;max-width:320px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);">
                    <div data-text style="font-size:1.15rem;font-weight:bold;margin-bottom:18px;"></div>
                    <div style="display:flex;gap:10px;justify-content:center;">
                        <button data-ok style="flex:1;padding:10px;font-size:1rem;font-weight:bold;border:none;border-radius:10px;background:#e53e3e;color:#fff;cursor:pointer;"></button>
                        <button data-cancel style="flex:1;padding:10px;font-size:1rem;border:none;border-radius:10px;background:#e2e8f0;color:#2d3748;cursor:pointer;">ביטול</button>

                bg.querySelector("[data-text]").textContent = text;

        async function clearWords() {
            const box = document.getElementById("words-input");
            if (box.value.trim() && !(await askConfirm("למחוק את כל המילים מהרשימה?", "מחיקה"))) return;

        // ---- Word table: rows are the editable view; the hidden textarea #words-input stays the stored text ----
        let rows = [];   // { en, he, extra: [custom wrong answers kept as-is] }

        function loadRows() {
            const text = document.getElementById("words-input").value;
            rows = text.replace(/^﻿/, "").split(/\r?\n/)
                .map(l => (l.includes("\t") ? l.split("\t") : l.split(/[,;]/)).map(x => x.trim()))
                .filter(r => r.some(x => x))
                .map(r => ({ en: r[0] || "", he: r[1] || "", extra: r.slice(2).filter(x => x) }));
        }

        function saveRows() {
            const text = rows
                .filter(r => r.en.trim() || r.he.trim())
                .map(r => {
                    const cells = [r.en.trim(), r.he.trim(), ...r.extra];
                    while (cells.length > 1 && !cells[cells.length - 1]) cells.pop();
                    return cells.join("\t");   // tab-separated, so commas inside a meaning are kept as typed
                }).join("\n");
            document.getElementById("words-input").value = text;
            // keep the list on the device after every change, so a refresh never brings back old words
            try { localStorage.setItem(storeKey(), text); } catch (e) {}
            updateWordsCount();
        }

        function updateWordsCount() {
            const n = rows.filter(r => r.en.trim() && r.he.trim()).length;
            document.getElementById("words-count").textContent = n ? `${n} מילים ברשימה`
                : mode === "random" ? "אין מילים עדיין – לחצו על 🎲 לקבלת 20 מילים" : "אין מילים עדיין – הוסיפו מילה או צלמו תמונה";
            document.getElementById("words-hint").textContent = rows.some(isAutoMeaning) ? "🟨 תורגם אוטומטית – לחצו ▾ לפירוש אחר" : "";

        function drawWords(focusIdx) {
            const t = document.getElementById("words-table");
            t.innerHTML = "";
            const hr = t.createTHead().insertRow();
            [["English", "left"], ["עברית", "right"], ["", "center"]].forEach(([label, align], i) => {
                const th = document.createElement("th");

        }

        function buildWordRow(body, r) {
            const tr = body.insertRow();
            tr.style.borderTop = "1px solid #e2e8f0";
            let heInp, altBtn;
            // light yellow = the meaning came from automatic translation and wasn't confirmed; ▾ only when there's a word
            const refresh = () => {
                const auto = isAutoMeaning(r);
                heInp.style.background = auto ? "#fffbea" : "";
                heInp.style.borderColor = auto ? "#ecc94b" : "#cbd5e0";
                altBtn.style.visibility = r.en.trim() ? "visible" : "hidden";
            };
            [["en", "ltr", "אנגלית"], ["he", "rtl", "עברית"]].forEach(([key, dir, label]) => {
                const td = tr.insertCell();
                td.style.cssText = "padding:4px;position:relative;";
                const inp = document.createElement("input");

                inp.dir = dir;
                inp.setAttribute("aria-label", label);
                inp.autocomplete = "off";
                inp.style.cssText = "width:100%;box-sizing:border-box;padding:8px;font-size:1rem;border:1px solid #cbd5e0;border-radius:8px;" + (key === "he" ? "padding-left:32px;" : "");
                inp.addEventListener("input", () => { r[key] = inp.value; saveRows(); refresh(); });
                td.appendChild(inp);
                if (key === "he") {
                    heInp = inp;
                    // a meaning typed by hand counts as confirmed: remembered, so reading the same word again keeps it
                    inp.addEventListener("change", () => {
                        const en = r.en.trim().toLowerCase(), he = inp.value.trim();
                        if (en && he) { chosen[en] = he; try { localStorage.setItem(CH_KEY, JSON.stringify(chosen)); } catch (e) {} }
                        refresh();
                    });
                    altBtn = document.createElement("button");
                    altBtn.type = "button";
                    altBtn.textContent = "▾";
                    altBtn.setAttribute("aria-label", "פירושים נוספים");
                    altBtn.title = "פירושים נוספים";
                    altBtn.style.cssText = "position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1rem;color:#4a5568;cursor:pointer;padding:4px;";
                    altBtn.onclick = async () => {
                        const choice = await chooseMeaning(r.en.trim(), r.he.trim());
                        if (!choice) return;
                        r.he = choice; heInp.value = choice;
                        chosen[r.en.trim().toLowerCase()] = choice;   // remembered: the same word gets this meaning next time
                        try { localStorage.setItem(CH_KEY, JSON.stringify(chosen)); } catch (e) {}
                        saveRows(); refresh();
                    };
                    td.appendChild(altBtn);
                }
            });
            const td = tr.insertCell();
            td.style.cssText = "padding:4px;text-align:center;";
            const del = document.createElement("button");
            del.type = "button";
            del.textContent = "🗑️";
            del.setAttribute("aria-label", "מחיקת השורה");
            del.style.cssText = "font-size:1.2rem;background:none;border:none;cursor:pointer;padding:6px;";
            del.onclick = () => { rows.splice(rows.indexOf(r), 1); saveRows(); drawWords(); };
            td.appendChild(del);
            refresh();
        }

        // Re-read the stored text and redraw (call after changing #words-input programmatically)

        function speakWord() {
            const word = document.getElementById("question-word").innerText.trim();
            if (!word || !("speechSynthesis" in window)) return;
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = "en-US";
            u.rate = 0.85;

            if (v) u.voice = v;

        if (!("speechSynthesis" in window)) document.addEventListener("DOMContentLoaded", () => { const b = document.getElementById("speak-btn"); if (b) b.style.display = "none"; });

        function showStart() {
            document.getElementById("summary-screen").style.display = "none";
            document.getElementById("game-screen").style.display = "none";
            document.getElementById("start-screen").style.display = "flex";
        }

        let ocrWorker = null;

        function loadScript(src) {
            return new Promise((res, rej) => {
                const t = document.createElement("script");
                t.src = src; t.onload = res; t.onerror = () => rej(new Error("טעינת OCR נכשלה (צריך אינטרנט)"));
                document.head.appendChild(t);
            });
        }

        async function getWorker() {
            if (ocrWorker) return ocrWorker;
            if (!window.Tesseract) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js");
            ocrWorker = await Tesseract.createWorker("eng+heb+ara");
            return ocrWorker;
        }

        function drawRotated(bmp, deg) {
            const scale = Math.min(1.5, 2200 / Math.max(bmp.width, bmp.height));
            const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
            const c = document.createElement("canvas");
            const swap = deg === 90 || deg === 270, pad = Math.round(Math.max(w, h) * 0.04);
            c.width = (swap ? h : w) + 2 * pad; c.height = (swap ? w : h) + 2 * pad;
            const x = c.getContext("2d");
            x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
            x.translate(c.width / 2, c.height / 2);
            x.rotate(deg * Math.PI / 180);
            x.drawImage(bmp, -w / 2, -h / 2, w, h);
            return c;
        }

        // Local-contrast black/white: removes shadows and text showing through from the other side of the page.
        function binarize(canvas) {
            const W = canvas.width, H = canvas.height, ctx = canvas.getContext("2d");
            const img = ctx.getImageData(0, 0, W, H), d = img.data;
            const g = new Float32Array(W * H), I = new Float64Array((W + 1) * (H + 1));
            for (let i = 0; i < W * H; i++) g[i] = (d[i * 4] * 3 + d[i * 4 + 1] * 6 + d[i * 4 + 2]) / 10;
            for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += g[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + row; } }
            const r = Math.max(10, Math.round(Math.max(W, H) / 40));
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1), y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
                const mean = (I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0]) / ((x1 - x0) * (y1 - y0));
                const v = g[y * W + x] < mean * 0.85 ? 0 : 255, k = (y * W + x) * 4;
                d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            return canvas;
        }

        // Returns the photo in black/white. If it has a framed box (e.g. "New Words"), only the inside of the box
        // is kept (everything outside painted white, cropped to the box).
        function boxOnly(bmp) {
            const full = document.createElement("canvas");
            const fs = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
            full.width = Math.round(bmp.width * fs); full.height = Math.round(bmp.height * fs);
            full.getContext("2d").drawImage(bmp, 0, 0, full.width, full.height);
            binarize(full);

            const sc = Math.min(1, 700 / Math.max(full.width, full.height));
            const W = Math.round(full.width * sc), H = Math.round(full.height * sc);
            const small = document.createElement("canvas"); small.width = W; small.height = H;
            small.getContext("2d").drawImage(full, 0, 0, W, H);
            const px = small.getContext("2d").getImageData(0, 0, W, H).data;
            // dark pixels, slightly thickened so a thin frame stays connected
            const dark = new Uint8Array(W * H);
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (px[(y * W + x) * 4] < 128)
                for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                    const yy = y + dy, xx = x + dx;
                    if (yy >= 0 && yy < H && xx >= 0 && xx < W) dark[yy * W + xx] = 1;
                }
            // connected components; the frame = a big, thin one
            const lab = new Int32Array(W * H), stack = [];
            let best = null, n = 0;
            for (let i = 0; i < W * H; i++) if (dark[i] && !lab[i]) {
                n++; let cnt = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
                lab[i] = n; stack.push(i);
                while (stack.length) {
                    const j = stack.pop(), x = j % W, y = (j - x) / W; cnt++;
                    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
                    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                        const yy = y + dy, xx = x + dx, k = yy * W + xx;
                        if (yy >= 0 && yy < H && xx >= 0 && xx < W && dark[k] && !lab[k]) { lab[k] = n; stack.push(k); }
                    }
                }
                const area = (x1 - x0 + 1) * (y1 - y0 + 1);
                if (area > 0.15 * W * H && cnt / area < 0.2 && (!best || area > best.area)) best = { id: n, area };
            }
            if (!best) return full;
            // inside = odd number of frame crossings in at least 3 of the 4 directions
            const isF = i => lab[i] === best.id, votes = new Uint8Array(W * H);
            const scan = (outerN, innerN, idx) => {
                for (let o = 0; o < outerN; o++) {
                    let par = 0, inF = false;
                    for (let t = 0; t < innerN; t++) { const i = idx(o, t); if (isF(i)) { if (!inF) par ^= 1; inF = true; } else { inF = false; votes[i] += par; } }
                    par = 0; inF = false;
                    for (let t = innerN - 1; t >= 0; t--) { const i = idx(o, t); if (isF(i)) { if (!inF) par ^= 1; inF = true; } else { inF = false; votes[i] += par; } }
                }
            };
            scan(W, H, (x, y) => y * W + x);
            scan(H, W, (y, x) => y * W + x);
            let bx0 = W, bx1 = 0, by0 = H, by1 = 0, inside = 0;
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (votes[y * W + x] >= 3) {
                inside++; if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y;
            }
            if (inside < 0.1 * W * H) return full;
            // white overlay for everything outside the box
            const ov = document.createElement("canvas"); ov.width = W; ov.height = H;
            const oc = ov.getContext("2d"), od = oc.createImageData(W, H);
            for (let i = 0; i < W * H; i++) if (votes[i] < 3) { od.data[i * 4] = od.data[i * 4 + 1] = od.data[i * 4 + 2] = 255; od.data[i * 4 + 3] = 255; }
            oc.putImageData(od, 0, 0);
            const fc = full.getContext("2d");
            fc.imageSmoothingEnabled = false;
            fc.drawImage(ov, 0, 0, full.width, full.height);
            const out = document.createElement("canvas");
            const cx = Math.round(bx0 / sc), cy = Math.round(by0 / sc);
            out.width = Math.round((bx1 - bx0 + 1) / sc); out.height = Math.round((by1 - by0 + 1) / sc);
            out.getContext("2d").drawImage(full, cx, cy, out.width, out.height, 0, 0, out.width, out.height);
            return out;
        }

        const isHe = s => /[\u0590-\u05FF]/.test(s);
        const EN_ONLY_MIN_CONF = /*EN_THR*/60;   // min OCR confidence for a word in an English-only list

        // Returns [{en, he}] — he is the Hebrew found next to the word in the photo: on the same line,
        // or directly below it (card layouts: English word, Hebrew under it). Arabic is ignored.
        function itemsFromLines(lines) {
            const all = [];
            lines.forEach((line, li) => {
                const ws = line.words
                    .filter(w => !/[\u0600-\u06FF]/.test(w.text) && /[A-Za-z\u0590-\u05FF]/.test(w.text) && w.confidence > (isHe(w.text) ? 40 : 55))
                    .sort((p, q) => p.bbox.x0 - q.bbox.x0);
                let cur = [];
                const flush = () => {
                    if (!cur.length) return;
                    const he = isHe(cur[0].text);
                    const t = he
                        ? cur.slice().reverse().map(w => w.text).join(" ").replace(/[^\u0590-\u05FF' ,\-]/g, "").replace(/\s+/g, " ").replace(/^[ ,]+|[ ,]+$/g, "").trim()
                        : cur.map(w => w.text).join(" ").replace(/\(\w+\)/g, "").replace(/[^A-Za-z' ]/g, "").replace(/\s+/g, " ").replace(/^[b-hj-zB-HJ-Z] /, "").trim();   // a stray letter before a word is noise (only "a"/"I" are real words)
                    if (t.length >= 2) all.push({ he, t, li, conf: Math.min(...cur.map(w => w.confidence)),
                        x0: cur[0].bbox.x0, x1: cur[cur.length - 1].bbox.x1,
                        y0: Math.min(...cur.map(w => w.bbox.y0)), y1: Math.max(...cur.map(w => w.bbox.y1)) });
                    cur = [];
                };
                for (const w of ws) {
                    const h = w.bbox.y1 - w.bbox.y0, prev = cur[cur.length - 1];
                    if (prev && (w.bbox.x0 - prev.bbox.x1 > h * 1.2 || isHe(w.text) !== isHe(prev.text))) flush();
                    cur.push(w);
                }
                flush();
            });
            const heSegs = all.filter(x => x.he), en = all.filter(x => !x.he);
            const cx = q => (q.x0 + q.x1) / 2, pair = new Map();
            const match = ok => {
                for (const sg of en) if (!pair.has(sg)) {
                    let best = null;
                    for (const h of heSegs) if (!h.used && ok(sg, h) && (!best || ok.better(sg, h, best))) best = h;
                    if (best) { best.used = true; pair.set(sg, best); }
                }
            };
            const nearX = (sg, h, b) => Math.abs(cx(h) - cx(sg)) < Math.abs(cx(b) - cx(sg));
            // 1) same OCR line  2) same row, side by side  3) directly below (card layouts)
            const sameLine = (sg, h) => h.li === sg.li; sameLine.better = nearX; match(sameLine);
            const sameRow = (sg, h) => Math.min(h.y1, sg.y1) - Math.max(h.y0, sg.y0) >= 0.5 * Math.min(h.y1 - h.y0, sg.y1 - sg.y0)
                && Math.max(h.x0 - sg.x1, sg.x0 - h.x1) <= 6 * (sg.y1 - sg.y0);
            sameRow.better = nearX; match(sameRow);
            const below = (sg, h) => {
                const lh = sg.y1 - sg.y0;
                return h.y0 >= sg.y1 - lh * 0.3 && h.y0 - sg.y1 <= lh * 2.5 && Math.min(h.x1, sg.x1) - Math.max(h.x0, sg.x0) >= -lh;
            };
            below.better = (sg, h, b) => h.y0 < b.y0 || (h.y0 === b.y0 && nearX(sg, h, b)); match(below);
            // Two kinds of photos: English+Hebrew pairs (most words have a Hebrew partner) and English-only lists.
            // In an English-only list, a stray Hebrew label in the page margin must not become a "meaning".
            const paired = en.filter(sg => pair.has(sg)).length;
            const hasHe = paired >= 3 && paired >= 0.3 * en.length;
            const items = [];
            for (const sg of en) {
                const he = hasHe ? pair.get(sg) : null;
                if (he ? sg.conf < 60 : sg.conf < (hasHe ? 90 : EN_ONLY_MIN_CONF)) continue;
                items.push({ en: sg.t, he: he ? he.t : "" });
            }
            return items;
        }

        async function ocrPhoto(file, status) {
            const worker = await getWorker();
            const bmp = boxOnly(await createImageBitmap(file));
            let best = null;
            await worker.setParameters({ tessedit_pageseg_mode: "11" });
            for (const deg of [0, 90, 270]) {
                status.innerText = `קורא תמונה (כיוון ${deg}°)...`;
                const { data } = await worker.recognize(drawRotated(bmp, deg));
                const good = data.words.filter(w => w.confidence > 75 && /^[A-Za-z]{3,}$/.test(w.text)).length;
                if (!best || good > best.good) best = { good, deg, lines: data.lines };
                if (good > 25) break;
            }
            const a = itemsFromLines(best.lines);
            status.innerText = "קורא שוב (פריסה אחרת)...";
            await worker.setParameters({ tessedit_pageseg_mode: "3" });
            const { data } = await worker.recognize(drawRotated(bmp, best.deg));
            const b = itemsFromLines(data.lines);
            const score = items => items.filter(i => i.he).length * 2 + items.length;
            return score(b) > score(a) ? b : a; // a = sparse layout (cards), b = auto layout (lists)
        }

        // Google's public web translate endpoint: fast (~0.4s per word). Throws on network/HTTP errors so the
        // caller can fall back to MyMemory. Strips niqqud (vowel marks); too long / non-Hebrew results keep the English word.
        async function translateGoogle(word) {
            const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&q=" + encodeURIComponent(word));
            if (!r.ok) throw new Error("תקלת רשת בתרגום");
            const j = await r.json();
            const t = ((j && j[0]) || []).map(s => s[0]).join("")
                .replace(/[֑-ׇ]/g, "").replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "").replace(/[,;]/g, " /").replace(/[.!?]+$/, "").trim();
            return /^[֐-׿\s'"\-\/]+$/.test(t) && t.split(/\s+/).length <= 4 ? t : word;
        }

        async function translate(word) {
            try { return await translateGoogle(word); }
            catch (e) { return await translateMyMemory(word); }
        }

        async function translateMyMemory(word) {
            const r = await fetch("https://api.mymemory.translated.net/get?langpair=en|he&q=" + encodeURIComponent(word));
            if (!r.ok) throw new Error("תקלת רשת בתרגום");
            const j = await r.json();
            const t0 = j.responseData && j.responseData.translatedText || "";
            if (/MYMEMORY WARNING|QUERY LENGTH/i.test(t0) || j.responseStatus == 429) throw new Error("חרגת ממכסת התרגום היומית");
            const clean = t => (t || "").replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "").replace(/[,;]/g, " /").replace(/[.!?]+$/, "").trim();
            const ok = t => /^[\u0590-\u05FF\s'"\-\/]+$/.test(t) && t.split(/\s+/).length <= 4;
            const ms = j.matches || [];
            const mt = ms.find(m => m["created-by"] === "MT!");
            const cands = [mt && mt.translation, t0, ...ms.map(m => m.translation)].map(clean);
            return cands.find(ok) || word;
        }

        // The free service rate-limits bursts (blocked requests look like CORS/network errors), so: retry with a
        // growing pause, and remember good translations on this device. Returns null if it never answered.
        const TR_KEY = 'englishquiz-translations';
        let trCache = {};
        try { trCache = JSON.parse(localStorage.getItem(TR_KEY) || "{}"); } catch (e) {}
        // Meanings picked by hand with the ▾ button. They win over the automatic translation next time.
        const CH_KEY = 'englishquiz-chosen';
        let chosen = {};
        try { chosen = JSON.parse(localStorage.getItem(CH_KEY) || "{}"); } catch (e) {}
        // true = the cell holds an automatic translation that nobody confirmed (shown in light yellow)
        const isAutoMeaning = r => {
            const k = r.en.trim().toLowerCase(), he = r.he.trim();
            return !!he && trCache[k] === he && chosen[k] !== he;
        };

        // Other meanings of an English word from Google's dictionary data, grouped by part of speech.
        const POS_HE = { noun: "שם עצם", verb: "פועל", adjective: "תואר", adverb: "תואר פועל", preposition: "מילת יחס", pronoun: "כינוי", conjunction: "מילת חיבור", interjection: "מילת קריאה", determiner: "מגדיר", article: "מגדיר" };
        const altCache = {};
        async function fetchAlternatives(word) {
            const key = word.toLowerCase();
            if (altCache[key]) return altCache[key];
            const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=iw&dt=t&dt=bd&q=" + encodeURIComponent(word));
            if (!r.ok) throw new Error("תקלת רשת");
            const j = await r.json();
            const strip = s => String(s).replace(/[֑-ׇ]/g, "").trim();
            const groups = [];
            for (const e of (j && j[1]) || []) {
                const terms = [...new Set((e[1] || []).map(strip).filter(t => t && /^[֐-׿\s'"\-]+$/.test(t)))].slice(0, 6);
                if (terms.length) groups.push({ pos: POS_HE[e[0]] || e[0], terms });
            }
            if (!groups.length) {   // no dictionary entry: offer at least the plain translation
                const main = strip(((j && j[0]) || []).map(s => s[0]).join(""));
                if (/^[֐-׿\s'"\-]+$/.test(main)) groups.push({ pos: "", terms: [main] });
            }
            return (altCache[key] = groups);
        }

        // Chooser dialog. Resolves with the picked meaning, or null if cancelled.
        function chooseMeaning(en, current) {
            return new Promise(resolve => {
                const bg = document.createElement("div");
                bg.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;";
                const box = document.createElement("div");
                box.dir = "rtl";
                box.style.cssText = "background:#fff;color:#1a202c;border-radius:16px;padding:18px 16px 14px;max-width:340px;width:100%;max-height:80vh;overflow:auto;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);";
                const title = document.createElement("div");
                title.dir = "ltr";
                title.textContent = en;
                title.style.cssText = "font-size:1.3rem;font-weight:bold;margin-bottom:4px;";
                const sub = document.createElement("div");
                sub.textContent = "בחרו פירוש:";
                sub.style.cssText = "font-size:0.9rem;color:#4a5568;margin-bottom:10px;";
                const body = document.createElement("div");
                body.dataset.role = "alternatives";
                body.textContent = "טוען...";
                body.style.cssText = "text-align:right;";
                const cancel = document.createElement("button");
                cancel.type = "button";
                cancel.textContent = "ביטול";
                cancel.style.cssText = "margin-top:12px;width:100%;padding:10px;font-size:1rem;border:none;border-radius:10px;background:#e2e8f0;color:#2d3748;cursor:pointer;";
                const done = v => { bg.remove(); resolve(v); };
                cancel.onclick = () => done(null);
                bg.onclick = e => { if (e.target === bg) done(null); };
                box.append(title, sub, body, cancel);
                bg.appendChild(box);
                document.body.appendChild(bg);
                fetchAlternatives(en).then(groups => {
                    body.textContent = "";
                    if (!groups.length) { body.textContent = "לא נמצאו פירושים נוספים."; return; }
                    for (const g of groups) {
                        if (g.pos) {
                            const label = document.createElement("div");
                            label.textContent = g.pos;
                            label.style.cssText = "font-size:0.8rem;color:#718096;margin:8px 0 4px;";
                            body.appendChild(label);
                        }
                        const wrap = document.createElement("div");
                        wrap.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;";
                        for (const t of g.terms) {
                            const b = document.createElement("button");
                            b.type = "button";
                            b.textContent = t;
                            b.style.cssText = `padding:8px 12px;font-size:1rem;border:none;border-radius:10px;cursor:pointer;background:${t === current ? "#bee3f8" : "#e2e8f0"};color:#2d3748;`;
                            b.onclick = () => done(t);
                            wrap.appendChild(b);
                        }
                        body.appendChild(wrap);
                    }
                }).catch(() => { body.textContent = "לא הצלחנו לטעון פירושים – בדקו את החיבור לאינטרנט."; });
            });
        }

        async function translateWithRetry(word) {
            const key = word.toLowerCase();
            if (chosen[key]) return chosen[key];
            if (trCache[key]) return trCache[key];
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const t = await translate(word);
                    if (t !== word) { trCache[key] = t; try { localStorage.setItem(TR_KEY, JSON.stringify(trCache)); } catch (e) {} }
                    return t;
                } catch (err) {
                    if (/מכסת/.test(err.message)) throw err;
                    await new Promise(res => setTimeout(res, 700 * (attempt + 1)));
                }
            }
            return null;
        }

        // ---- Random words from the built-in word bank: wordbank/level-1.txt ... level-10.txt, "english|hebrew" per line ----
        const LEVEL_KEY = 'englishquiz-level';
        const levelCache = {};
        async function loadLevel(level) {
            if (levelCache[level]) return levelCache[level];
            const res = await fetch(`wordbank/level-${level}.txt`);
            if (!res.ok) throw new Error("לא נטען");
            const text = new TextDecoder("utf-8").decode(await res.arrayBuffer());
            const words = text.split(/\r?\n/).map(l => l.split("|"))
                .filter(p => p.length >= 2 && p[0].trim() && p[1].trim())
                .map(p => ({ en: p[0].trim(), he: p[1].trim() }));
            return (levelCache[level] = words);
        }

        function saveLevel() {
            try { localStorage.setItem(LEVEL_KEY, document.getElementById("level-select").value); } catch (e) {}
        }

        // Puts 20 random words of the chosen level into the table (the student can still edit before starting).
        async function randomWords() {
            const level = +document.getElementById("level-select").value;
            const status = document.getElementById("random-status");
            status.textContent = "";
            let words;
            try { words = await loadLevel(level); }
            catch (e) { status.textContent = "לא הצלחנו לטעון את מאגר המילים – בדקו את החיבור לאינטרנט."; return; }
            if (rows.some(r => r.en.trim() || r.he.trim()) && !(await askConfirm("להחליף את הרשימה הנוכחית ב-20 מילים אקראיות?", "החלפה"))) return;
            const picked = shuffle(words.slice()).slice(0, 20);
            // a meaning picked by hand earlier (▾) wins over the bank's default
            rows = picked.map(w => ({ en: w.en, he: chosen[w.en.toLowerCase()] || w.he, extra: [] }));
            saveRows();
            drawWords();
            document.getElementById("start-error").innerText = "";
            status.textContent = `נבחרו ${picked.length} מילים מרמה ${level}. לחצו "התחל משחק".`;
        }

        try { const lv = localStorage.getItem(LEVEL_KEY); if (lv) document.getElementById("level-select").value = lv; } catch (e) {}
        // once, in the background: fetch all levels so the service worker keeps them for offline use
        window.addEventListener("load", () => setTimeout(() => {
            try { if (localStorage.getItem("englishquiz-bank-cached") === "1") return; } catch (e) {}
            Promise.all(Array.from({ length: 10 }, (_, i) => fetch(`wordbank/level-${i + 1}.txt`).then(r => { if (!r.ok) throw 0; })))
                .then(() => { try { localStorage.setItem("englishquiz-bank-cached", "1"); } catch (e) {} }).catch(() => {});
        }, 3000));

        document.getElementById("photo-input").addEventListener("change", async e => {
            const files = [...e.target.files];
            const status = document.getElementById("photo-status");
            const box = document.getElementById("words-input");
            if (!files.length) return;
            const startBtn = document.getElementById("start-btn");
            startBtn.disabled = true;
            document.querySelectorAll(".tab-btn").forEach(b => b.disabled = true);   // stay on this tab until the photo is done
            let failed = 0;
            try {
                for (let i = 0; i < files.length; i++) {
                    status.innerText = `תמונה ${i + 1}/${files.length}: טוען OCR...`;
                    const items = [], byEn = {};
                    for (const it of await ocrPhoto(files[i], status)) {
                        const key = it.en.toLowerCase();
                        if (!(key in byEn)) { byEn[key] = items.length; items.push(it); }
                        else if (!items[byEn[key]].he) items[byEn[key]].he = it.he;
                    }
                    const out = new Array(items.length);
                    let next = 0, done = 0;
                    const run = async () => {
                        while (next < items.length) {
                            const k = next++;
                            let t = items[k].he;
                            if (!t) { t = await translateWithRetry(items[k].en); if (t === null) failed++; }
                            out[k] = `${items[k].en}\t${t === null ? "" : (t || items[k].en)}`;   // no answer -> blank cell to fill in
                            status.innerText = `מתרגם ${++done}/${items.length}...`;
                        }
                    };
                    await Promise.all([run(), run(), run(), run()]);
                    const have = new Set(box.value.split(/\r?\n/).map(l => l.trim()));
                    const add = out.filter(l => l && !have.has(l));
                    box.value = (box.value.trim() ? box.value.trim() + "\n" : "") + add.join("\n");
                    renderWords();
                    saveRows();   // keep the words from the photo on the device right away
                }
                status.innerText = failed
                    ? `מוכן! ${failed} מילים לא תורגמו (שירות התרגום עמוס) – השלימו אותן ידנית בטבלה, או נסו שוב עוד רגע.`
                    : "מוכן! בדקו את הרשימה ולחצו התחל.";
            } catch (err) {
                status.innerText = "שגיאה: " + err.message;
            } finally {
                startBtn.disabled = false;
                document.querySelectorAll(".tab-btn").forEach(b => b.disabled = false);
            }
            e.target.value = "";
        });

        // ---- Tabs: random words / picture. Each tab has its own list. ----
        function applyModeUI() {
            for (const m of ["random", "picture"]) {
                document.getElementById("tab-" + m).setAttribute("aria-selected", String(m === mode));
                document.getElementById("panel-" + m).style.display = m === mode ? "" : "none";
            }
        }

        function setMode(m) {
            if (m !== "random" && m !== "picture") return;
            saveRows();   // the list we are leaving stays saved under its own key
            mode = m;
            try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
            document.getElementById("words-input").value = readList(m);
            applyModeUI();
            renderWords();
            for (const id of ["start-error", "random-status", "photo-status"]) document.getElementById(id).textContent = "";
        }

        showGrandTotal();
        document.getElementById("words-input").value = readList(mode);
        applyModeUI();
        renderWords();
    </script>
</body>
</html>
