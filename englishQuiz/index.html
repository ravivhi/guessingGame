<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4a00e0">
    <title>בוחן באנגלית - אליפות!</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="בוחן באנגלית">
    <meta property="og:image" content="https://ravivh.com/englishQuiz/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://ravivh.com/englishQuiz/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://ravivh.com/englishQuiz/preview.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* no pull-to-refresh: swiping down must not reload the page */
        html, body {
            overscroll-behavior-y: none;
        }

        /* The page itself never scrolls: it is exactly one screen high, the card fits inside it and
           only the words table scrolls (see .words-box). margin:auto centres the card and, unlike
           align-items:center, keeps it reachable if a very short screen makes it taller than the page. */
        body {
            margin: 0;
            padding: 10px;
            background: var(--bg, linear-gradient(135deg, #4a00e0, #8e2de2));   /* a background bought in the shop */
            display: flex;
            height: 100vh;
            height: 100dvh;
            color: #333;
        }

        .game-container {
            width: 100%;
            max-width: 450px;
            min-width: 0;
            margin: auto;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            text-align: center;
        }

        /* start screen: everything keeps its size, the words box takes the remaining height */
        #start-screen {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
        }
        #start-screen > * { flex: none; }
        #start-screen > .words-box {
            flex: 1 1 auto;
            min-height: 96px;
            overflow: auto;
        }


        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .score-box {
            color: #2b6cb0;
        }

        .timer-box {
            color: #dd6b20;
        }

        .progress-box {
            font-size: 0.9rem;
            color: #718096;
        }

        .question-text {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #1a202c;
        }

        .instruction-text {
            font-size: 1rem;
            color: #718096;
            margin-bottom: clamp(3px, 1.5vh, 15px);   /* grows with screen height, shrinks on short phones */
        }

        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn-answer {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            background-color: #edf2f7;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.15s, transform 0.1s, border-color 0.15s;
            touch-action: manipulation;
        }

        .btn-answer:active {
            transform: scale(0.98);
        }

        .btn-answer.correct {
            background-color: #48bb78 !important;
            border-color: #38a169 !important;
            color: white;
        }

        .btn-answer.wrong {
            background-color: #f56565 !important;
            border-color: #e53e3e !important;
            color: white;
        }

        .summary-screen {
            display: none;
        }

        .emoji-animation {
            font-size: 5rem;
            margin: 20px 0;
            display: inline-block;
            animation: bounce 0.8s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .bonus-badge {
            background-color: #feebc8;
            color: #c05621;
            padding: 10px 15px;
            border-radius: 30px;
            display: inline-block;
            font-weight: bold;
            margin: 15px 0;
            border: 1px dashed #dd6b20;
        }

        /* the two modes of the start screen: random words / words from a picture */
        .tabs { display: flex; gap: 6px; margin: 2px 0 8px; }
        .tab-btn {
            flex: 1;
            padding: 9px 6px;
            font-size: 0.95rem;
            font-weight: 600;
            background: #edf2f7;
            color: #4a5568;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .tab-btn[aria-selected="true"] {
            background: #3182ce;
            border-color: #3182ce;
            color: #fff;
            box-shadow: 0 2px 4px rgba(50,130,206,0.35);
        }
        .tab-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* a big emoji at the top of the quiz: gets happier every 5 first-try answers in a row.
           It sits in the gap between the word and the answers, and slides open there when it appears. */
        #streak-emoji {
            width: fit-content;   /* only as wide as the emoji, so the pop animation can never widen the page */
            height: 0;
            margin: 0 auto;
            overflow: hidden;
            font-size: clamp(3rem, 9vh, 5rem);
            line-height: 1.15;
            text-align: center;
            opacity: 0;
            transition: height 0.3s, margin 0.3s, opacity 0.35s;
            pointer-events: none;
            user-select: none;
            position: relative;
            top: -0.06em;   /* the emoji is drawn low in its line box: lift it so the space above and below it looks equal */
        }
        #streak-emoji.on { height: 1.15em; margin: 4px auto 9px; opacity: 1; overflow: visible; }   /* 9px below = 4px + the word's 5px margin above, so both gaps match */
        #streak-emoji.pop { animation: streakPop 0.75s ease-out; }
        @keyframes streakPop {
            0%   { transform: scale(0.2) rotate(-15deg); }
            60%  { transform: scale(1.18) rotate(6deg); }
            100% { transform: scale(1) rotate(0); }
        }

        /* the small grey action buttons on the start screen (add / clear / random words / photo) */
        .action-btn {
            padding: 8px 12px;
            font-size: 0.95rem;
            background: #e2e8f0;
            color: #2d3748;
            border: 1px solid #cbd5e0;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .action-btn:active {
            background: #cbd5e0;
            box-shadow: none;
            transform: translateY(1px);
        }

        /* message lines take no space until they have text */
        #photo-status:empty, #start-error:empty, #words-hint:empty, #random-status:empty { display: none; }

        .btn-restart:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-restart {
            margin-top: 25px;
            padding: 15px 40px;
            font-size: 1.3rem;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(50,130,206,0.3);
        }


        /* ---- 📚 learning path: each level's categories in order; finish one to open the next ---- */
        #start-screen > #panel-category { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        #start-screen.cat-mode .list-only { display: none !important; }
        .path-head { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 2px 0 8px; }
        .path-title { font-weight: bold; color: #553c9a; font-size: 1.05rem; }
        #path-progress { font-weight: bold; color: #2b6cb0; font-size: 0.95rem; white-space: nowrap; }
        #cat-list { flex: 1 1 auto; min-height: 96px; overflow: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 8px 12px; }
        /* a part of the learning path: white until its quiz is passed, then green with ✅ */
        .cat-step {
            display: flex; align-items: center; gap: 8px; flex: none;
            width: 100%; padding: 8px 10px;
            border: 2px solid #e2e8f0; border-radius: 18px; background: #fff;
            text-align: right; color: #2d3748;
        }
        .cat-step .cat-emoji {
            flex: none; width: 2.5rem; height: 2.5rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; line-height: 1;
            background: #edf2f7; border-radius: 50%;
        }
        .cat-step .cat-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .cat-step .cat-name { font-size: 1rem; font-weight: bold; overflow-wrap: anywhere; }
        .cat-step .cat-meta { font-size: 0.78rem; opacity: 0.85; }
        .cat-step .cat-state { flex: none; font-size: 1.3rem; }
        .cat-step.done { background: linear-gradient(135deg, #38a169, #68d391); border-color: #2f855a; color: #fff; }
        .cat-step.done .cat-emoji { background: rgba(255,255,255,0.35); }
        .cat-row { display: flex; gap: 6px; align-items: stretch; }
        .cat-row > .cat-step { flex: 1; min-width: 0; }
        /* the 📖 learn and 📝 quiz buttons next to each part */
        .cat-btn { flex: none; width: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 0;
                   border: none; border-radius: 16px; color: #fff; font-family: inherit; font-size: 0.8rem; font-weight: bold; cursor: pointer;
                   touch-action: manipulation; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
        .cat-btn .cat-btn-icon { font-size: 1.35rem; line-height: 1; }
        .cat-learn { background: linear-gradient(135deg, #dd6b20, #f6ad55); }
        .cat-quiz { background: linear-gradient(135deg, #5a67d8, #9f7aea); }
        .cat-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
        @media (max-width: 360px) { .cat-btn { width: 44px; font-size: 0.72rem; border-radius: 14px; } .cat-row { gap: 5px; } .cat-step .cat-emoji { width: 2.1rem; height: 2.1rem; font-size: 1.35rem; } }

        /* 🛒 the shop: points buy a character (shown on the main screen) and a background */
        #start-screen { position: relative; }
        /* the shop: a round store button in the top-left corner of the main screen */
        #shop-btn { position: absolute; top: -8px; left: -8px; width: 46px; height: 46px; padding: 0; border: none; border-radius: 50%;
                    font-size: 1.55rem; line-height: 46px; cursor: pointer; background: linear-gradient(135deg, #f6ad55, #ed8936);
                    box-shadow: 0 3px 0 rgba(0,0,0,0.18); animation: shopWiggle 4s ease-in-out infinite; }
        #shop-btn[data-boxes]::after { content: attr(data-boxes); position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
                    padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #e53e3e; color: #fff; font-size: 0.7rem;
                    font-weight: bold; line-height: 18px; font-family: sans-serif; }
        /* 🎁 mystery boxes: earned after the last emoji, opened in the shop */
        .box-area { display: flex; align-items: center; gap: 10px; padding: 10px; margin-bottom: 8px; border-radius: 16px;
                    background: linear-gradient(135deg, #fefcbf, #fbd38d); box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
        #box-pic { font-size: 2.6rem; line-height: 1; min-width: 52px; }
        #box-pic.shake { animation: boxShake 0.65s ease-in-out; }
        @keyframes boxShake { 0%, 100% { transform: rotate(0) scale(1); } 20% { transform: rotate(-15deg) scale(1.1); } 40% { transform: rotate(15deg) scale(1.15); }
                              60% { transform: rotate(-12deg) scale(1.2); } 80% { transform: rotate(10deg) scale(1.25); } }
        .box-info { flex: 1; min-width: 0; text-align: start; }
        #box-count { font-weight: bold; color: #744210; }
        #box-hint { font-size: 0.8rem; color: #975a16; }
        #box-open { flex: none; padding: 8px 14px; border: none; border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: bold;
                    color: #fff; background: linear-gradient(135deg, #dd6b20, #e53e3e); box-shadow: 0 3px 0 rgba(0,0,0,0.15); cursor: pointer; }
        #box-open:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        /* the streak faces reached so far (from the first to the current one); the next ones stay hidden as ❓ */
        #faces-count { font-size: 0.85rem; color: #718096; }
        #shop-faces { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 8px; }
        .face { font-size: 1.5rem; line-height: 1; padding: 6px 0; border-radius: 10px; background: #fffff0; box-shadow: 0 2px 0 rgba(0,0,0,0.08); }
        .face.missing { background: #edf2f7; font-size: 1rem; padding: 10px 0; opacity: 0.55; box-shadow: none; }
        .face.current { background: #c6f6d5; outline: 3px solid #38a169; }
        #shop-awards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
        .award { position: relative; font-size: 1.8rem; line-height: 1; padding: 8px 0; border-radius: 12px; background: #fffff0; box-shadow: 0 2px 0 rgba(0,0,0,0.08); }
        .award.missing { background: #edf2f7; font-size: 1.2rem; padding: 13px 0; opacity: 0.6; }
        .award-n { position: absolute; bottom: 1px; left: 3px; font-size: 0.7rem; font-weight: bold; color: #744210; }
        #box-toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 10px 16px; border-radius: 16px;
                     background: #fffaf0; border: 3px solid #f6ad55; color: #744210; font-weight: bold; box-shadow: 0 6px 16px rgba(0,0,0,0.2);
                     width: max-content; max-width: calc(100% - 28px); box-sizing: border-box; text-align: center; pointer-events: none; display: none; }
        #box-toast.on { display: block; animation: cardPop 0.35s ease-out; }
        #shop-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
        @keyframes shopWiggle { 0%, 88%, 100% { transform: rotate(0); } 92% { transform: rotate(-12deg); } 96% { transform: rotate(12deg); } }
        /* the chosen character: a round badge in the top-right corner of the main screen (tap = it reacts and teaches a word) */
        #menu-avatar { position: absolute; top: -8px; right: -8px; width: 46px; height: 46px; padding: 0; border: 3px solid #f6ad55;
                       border-radius: 50%; font-size: 1.6rem; line-height: 40px; cursor: pointer; background: #fffaf0;
                       box-shadow: 0 3px 0 rgba(0,0,0,0.15); z-index: 5; touch-action: manipulation; }
        #menu-avatar:empty { display: none; }
        #menu-avatar:disabled { cursor: default; color: inherit; opacity: 1; }   /* off during its turn, but looks the same */
        /* the character's speech bubble, under it, with its tail pointing up at the character */
        #avatar-bubble { position: absolute; top: 48px; right: 0; z-index: 6; display: none; max-width: 230px; min-width: 150px;
                         padding: 10px 14px; border-radius: 16px; background: #fffaf0; border: 3px solid #f6ad55; color: #2d3748;
                         box-shadow: 0 6px 16px rgba(0,0,0,0.2); text-align: center; cursor: pointer; }
        #avatar-bubble::before { content: ""; position: absolute; top: -12px; right: 12px; border: 9px solid transparent; border-top: 0;
                                 border-bottom: 12px solid #f6ad55; }
        #avatar-bubble.on { display: block; animation: cardPop 0.3s ease-out; }
        #avatar-bubble .ab-say { font-size: 0.85rem; color: #975a16; font-weight: bold; }
        #avatar-bubble .ab-word { font-size: 1.5rem; font-weight: bold; color: #2b6cb0; margin-top: 2px; overflow-wrap: anywhere; }
        #avatar-bubble .ab-he { font-size: 1.1rem; margin-top: 2px; }
        #avatar-bubble .ab-hint { font-size: 0.7rem; color: #a0aec0; margin-top: 4px; }
        /* emojis bursting out of the character */
        #avatar-fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
        #avatar-fx span { position: absolute; font-size: 1.5rem; line-height: 1; will-change: transform, opacity; }
        /* the character asks the question in the game, and hops on every right answer */
        #game-avatar { display: inline-block; font-size: 1.6rem; line-height: 1; vertical-align: middle; margin-inline-end: 6px; }
        #game-avatar:empty { display: none; }
        #game-avatar.hop { animation: avatarHop 0.45s ease-out; }
        @keyframes avatarHop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-10px) scale(1.15); } }
        #shop-screen { flex-direction: column; flex: 1 1 auto; min-height: 0; }
        #shop-title { flex: 1; font-weight: bold; color: #4a5568; font-size: 1.15rem; }
        #shop-balance { font-weight: bold; color: #2b6cb0; white-space: nowrap; }
        #shop-msg { min-height: 1.3em; font-size: 0.95rem; font-weight: bold; margin: 0 0 4px; }
        .shop-body { flex: 1 1 auto; min-height: 0; overflow: auto; }
        .shop-section { font-weight: bold; color: #553c9a; text-align: start; margin: 6px 2px 6px; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-bottom: 8px; }
        .shop-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 3px solid transparent;
                     border-radius: 16px; background: #f7fafc; cursor: pointer; font-family: inherit; color: #2d3748; box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
        .shop-item .shop-pic { font-size: 2rem; line-height: 1.2; }
        .shop-item .shop-swatch { width: 52px; height: 34px; border-radius: 10px; }
        .shop-item .shop-name { font-size: 0.85rem; font-weight: bold; }
        .shop-item .shop-price { font-size: 0.8rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; background: #fefcbf; color: #975a16; }
        .shop-item.owned .shop-price { background: #c6f6d5; color: #276749; }
        .shop-item.active { border-color: #38a169; background: #f0fff4; }
        .shop-item.active .shop-price { background: #38a169; color: #fff; }
        .shop-item.poor { opacity: 0.55; }
        .shop-item.confirm { border-color: #dd6b20; background: #fffaf0; }
        .shop-item.confirm .shop-price { background: #dd6b20; color: #fff; }

        /* learning cards: the English word (read aloud) and its Hebrew meaning on one card */
        #learn-screen { flex-direction: column; }
        .learn-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        #learn-title { flex: 1; min-width: 0; font-weight: bold; color: #4a5568; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #learn-count { font-weight: bold; color: #2b6cb0; white-space: nowrap; }
        .learn-bar { height: 12px; background: #edf2f7; border-radius: 6px; overflow: hidden; margin-bottom: clamp(10px, 3vh, 24px); }
        #learn-bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #f6ad55, #38a169); border-radius: 6px; transition: width 0.3s; }
        .learn-card {
            height: clamp(200px, 44vh, 330px);
            display: flex; flex-direction: column;
            border-radius: 24px; overflow: hidden; color: #fff;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }
        .learn-top, .learn-bottom { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(4px, 1.5vh, 10px); padding: 8px 12px; min-height: 0; }
        .learn-top { flex: 1.25; background: linear-gradient(135deg, #667eea, #9f7aea); }
        .learn-bottom { flex: 1; background: linear-gradient(135deg, #38b2ac, #48bb78); }
        .learn-card.pop { animation: cardPop 0.35s ease-out; }
        @keyframes cardPop { from { transform: scale(0.92); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
        .learn-en { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 100%; }
        .learn-emoji { font-size: clamp(2rem, 7vh, 3.2rem); line-height: 1; }
        #learn-word, #learn-meaning { font-size: clamp(1.8rem, 6vh, 2.6rem); font-weight: bold; line-height: 1.2; overflow-wrap: anywhere; }
        #learn-speak { flex: none; width: 48px; height: 48px; font-size: 1.6rem; line-height: 1; background: rgba(255,255,255,0.25); border: none; border-radius: 50%; cursor: pointer; }
        .learn-nav { display: flex; gap: 10px; margin-top: clamp(12px, 3vh, 24px); }
        .learn-nav button {
            flex: 1; padding: 14px 8px;
            font-family: inherit; font-size: 1.15rem; font-weight: bold; color: #fff;
            border: none; border-radius: 14px; cursor: pointer; touch-action: manipulation;
        }
        #learn-prev { flex: 0 0 34%; background: #a0aec0; }
        #learn-next { background: #3182ce; box-shadow: 0 4px 0 #2c5282; }
        .learn-nav button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

        /* Small screens. Keep these LAST: they must come after the base rules above to override them. */
        @media (max-width: 360px) {
            #shop-btn { width: 36px; height: 36px; line-height: 36px; font-size: 1.2rem; top: -10px; left: -10px; }
            #menu-avatar { width: 36px; height: 36px; line-height: 30px; font-size: 1.2rem; top: -10px; right: -10px; }
            .game-container { padding: 14px; }
            /* narrow phones: slightly smaller buttons (all of them, so they keep one look) so the longer
               random-words label still shares a line with the level picker and the tab names stay on one line */
            .action-btn { font-size: 0.85rem; padding: 8px 8px; }
            #level-select { font-size: 0.85rem; padding: 7px 4px; }
            .tab-btn { font-size: 0.85rem; padding: 9px 4px; }
        }
        /* short phones: tighter big buttons / emoji so the result screen fits without page scrolling */
        @media (max-height: 700px) {

        }
    </style>

    <script>
        if ('serviceWorker' in navigator) {

    </script>
    <script>
        let wordsData = [];
        let fullWords = [];   // the whole list from the start screen (wordsData is a subset while practising missed words)
        let missed = [];      // words answered wrong at least once in the current round
        // Two modes (the tabs), each with its own word list kept on the device:
        //   random  - words picked from the built-in word bank (default tab)
        //   picture - words typed by hand or read from a photo (keeps the old key, so an older saved list shows up here)
        const MODE_KEY = 'englishquiz-mode';
        const LIST_KEYS = { random: 'englishquiz-words-random', picture: 'englishquiz-words' };
        let mode = 'category';   // new users start on the 📚 learning tab
        try { const m = localStorage.getItem(MODE_KEY); if (m === 'random' || m === 'picture' || m === 'category') mode = m; } catch (e) {}
        // the learning tab ('category') has no word list of its own; the hidden list area keeps the random list
        const storeKey = () => LIST_KEYS[mode] || LIST_KEYS.random;
        function readList(m) {
            let t = "";
            try { t = localStorage.getItem(LIST_KEYS[m] || LIST_KEYS.random) || (m === "picture" ? localStorage.getItem('englishpractice-words') : "") || ""; } catch (e) {}
            return t.replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "");
        }

        let currentIndex = 0;
        let totalScore = 0;
        let correctFirstTryCount = 0;
        
        // Scoring: +1 for a word answered right on the first try, -1 for a word missed on the first try,
        // +1 bonus for a round of 10+ words with no mistakes.
        // A round never ends below 0, and the points add up from game to game (saved on the device).
        const TOTAL_KEY = 'englishquiz-total-points';
        let grandTotal = 0;
        try { grandTotal = Math.max(0, parseInt(localStorage.getItem(TOTAL_KEY), 10) || 0); } catch (e) {}
        let wrongCount = 0;
        let canAnswer = true;
        let nextQuestionTimer = null;   // the short pause after a right answer, before the next question
        let currentAnswers = [], wrongPicks = [];   // the open question's answer buttons (in order) and the wrong ones tapped

        // A big emoji appears behind the quiz after 5 answers in a row that were right on the first try, and a
        // happier one every 5 more for the first 10 emojis, every 10 for emojis 11-20, every 15 for 21-30 (30 emojis
        // = a streak of 300). One wrong first try lowers the streak by 1.
        // The streak carries on into the next round and through the menu; only a wrong first try lowers it.
        // 30 emojis that look clearly different from each other (no near-twins like 😀 / 😃): faces from a slight
        // smile up to 😻 at 75, then 🤗 😉 😸 🤑 💯 and celebration symbols up to 👑 at a streak of 300.
        const STREAK_EMOJIS = ["🙂", "😊", "😄", "😆", "😎", "😍", "🥰", "🤩", "😂", "😋", "🥳", "🤪", "🤠", "😇", "😻",
                               "🤗", "😉", "😸", "🤑", "💯", "🔥", "🌈", "🦄", "🌟", "🚀", "🦸", "💎", "🏆", "🐲", "👑"];
        // Emojis 1-10 come every 5 right answers (5..50), 11-20 every 10 (60..150), 21-30 every 15 (165..300).
        function streakThreshold(n) { return n <= 10 ? 5 * n : n <= 20 ? 50 + 10 * (n - 10) : 150 + 15 * (n - 20); }
        function streakStage(s) {
            let stage = 0;
            while (stage < STREAK_EMOJIS.length && streakThreshold(stage + 1) <= s) stage++;
            return stage;
        }
        // The streak is saved on the device, so it survives a reload (e.g. the phone dropping the page in the background).
        const STREAK_KEY = "englishQuizStreak";
        let streak = 0, shownStage = 0;
        // Reaching the last emoji (a streak of 300) earns a 🎁 mystery box for the shop (with a trophy or a medal
        // inside), and the streak starts again from 0 - the faces start over.
        const BOX_GOAL = streakThreshold(STREAK_EMOJIS.length);
        try { streak = Math.max(0, parseInt(localStorage.getItem(STREAK_KEY), 10) || 0); } catch (e) {}
        // keepBig: only the numbers and the saved streak change, the big emoji stays (the last face stays up after a box)
        function updateStreakEmoji(keepBig) {
            try { localStorage.setItem(STREAK_KEY, String(streak)); } catch (e) {}
            const el = document.getElementById("streak-emoji");
            const stage = streakStage(streak);
            const menuEl = document.getElementById("menu-streak");   // small copy of the emoji on the main screen
            if (menuEl) menuEl.textContent = stage ? STREAK_EMOJIS[stage - 1] : "";
            const countEl = document.getElementById("menu-streak-count");   // the emoji's stage (1-30), next to the small emoji
            if (countEl) countEl.textContent = stage ? String(stage) : "";
            const nextEl = document.getElementById("streak-next");   // in the game: how many more right answers to the next emoji
            if (nextEl) nextEl.textContent = stage >= STREAK_EMOJIS.length ? "" : (stage === STREAK_EMOJIS.length - 1 ? "🎁 עוד " : "עוד ") + (streakThreshold(stage + 1) - streak);   // the last face brings the box
            if (stage === shownStage || keepBig) return;
            shownStage = stage;
            if (stage === 0) { el.classList.remove("on", "pop"); return; }   // a mistake: the emoji fades away
            el.textContent = STREAK_EMOJIS[stage - 1];
            el.classList.add("on");
            el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");   // pop in
        }
        updateStreakEmoji();   // show the emoji of a streak restored from the last visit

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // saved: { answers, wrong } when the app reopens in the middle of a question (same button order, same wrong taps)
        function loadQuestion(saved) {
            document.getElementById("total-progress").innerText = wordsData.length;

            if (currentIndex >= wordsData.length) {
                showSummary();
                return;
            }

            canAnswer = true;
            document.getElementById("current-progress").innerText = currentIndex + 1;

            const currentData = wordsData[currentIndex];
            document.getElementById("question-word").innerText = currentData.word;

            if (!(saved && Array.isArray(saved.answers) && saved.answers.includes(currentData.correct) && Array.isArray(saved.wrong))) saved = null;
            const allAnswers = saved ? saved.answers : shuffle([currentData.correct, ...currentData.dynamics]);
            currentAnswers = allAnswers;
            wrongPicks = saved ? saved.wrong.filter(a => a !== currentData.correct) : [];
            wrongCount = wrongPicks.length;

            const container = document.getElementById("answers-container");
            container.innerHTML = "";

            allAnswers.forEach(ans => {
                const button = document.createElement("button");
                button.className = "btn-answer";
                button.innerText = ans;
                button.onclick = () => handleAnswer(button, ans, currentData.correct);
                if (wrongPicks.includes(ans)) { button.classList.add("wrong"); button.disabled = true; }
                container.appendChild(button);
            });
            saveSession("game");
        }

        function handleAnswer(selectedButton, selectedAnswer, correctAnswer) {
            if (!canAnswer) return;

            if (selectedAnswer === correctAnswer) {
                canAnswer = false;
                selectedButton.classList.add("correct");

                if (wrongCount === 0) { totalScore += 1; correctFirstTryCount++; streak++; updateStreakEmoji(); earnBoxes(); }
                const av = document.getElementById("game-avatar");
                av.classList.remove("hop"); void av.offsetWidth; av.classList.add("hop");   // the character hops
                document.getElementById("score").innerText = totalScore;

                nextQuestionTimer = setTimeout(() => {
                    nextQuestionTimer = null;
                    currentIndex++;
                    loadQuestion();
                }, 500);
                saveSession("game");   // saved as already on the next question

            } else {
                selectedButton.classList.add("wrong");
                selectedButton.disabled = true;
                if (wrongCount === 0) { totalScore = Math.max(0, totalScore - 1); streak = Math.max(0, streak - 1); updateStreakEmoji(); }
                wrongCount++;
                document.getElementById("score").innerText = totalScore;
                const cur = wordsData[currentIndex];
                if (!missed.includes(cur)) missed.push(cur);
                wrongPicks.push(selectedAnswer);
                saveSession("game");
            }
        }

        function showSummary() {
            document.getElementById("game-screen").style.display = "none";
            const summaryScreen = document.getElementById("summary-screen");
            summaryScreen.style.display = "block";

            const totalWords = wordsData.length;
            const successRate = (correctFirstTryCount / totalWords) * 100;

            let emoji = "💪";
            let title = "כל הכבוד על המאמץ!";
            
            if (successRate >= 90) {
                emoji = "🏆";
                title = "וואו! אתם פשוט אלופים!";
            } else if (successRate >= 70) {
                emoji = "⭐";
                title = "עבודה מצוינת!";
            }

            const bonusContainer = document.getElementById("bonus-container");
            bonusContainer.innerHTML = "";
            // Bonus only for a quiz of at least 10 words, all answered right on the first try
            if (totalWords >= 10 && correctFirstTryCount === totalWords) {
                totalScore += 1;
                const bonusBadge = document.createElement("div");
                bonusBadge.className = "bonus-badge";
                bonusBadge.innerText = "💥 מטורף! נקודת בונוס על בוחן בלי טעויות!";
                bonusContainer.appendChild(bonusBadge);
            }
            totalScore = Math.max(0, totalScore);
            grandTotal += totalScore;
            try { localStorage.setItem(TOTAL_KEY, String(grandTotal)); } catch (e) {}
            showGrandTotal();

            document.getElementById("summary-emoji").innerText = emoji;
            document.getElementById("summary-title").innerText = title;
            document.getElementById("summary-stats").innerText = `צדקתם בניסיון ראשון ב-${correctFirstTryCount} מתוך ${totalWords} מילים`;
            document.getElementById("summary-final-score").innerText = `נקודות בבוחן: ${totalScore} · סה״כ: ${grandTotal}`;

            const practiceBtn = document.getElementById("practice-missed-btn");
            practiceBtn.style.display = missed.length ? "" : "none";
            practiceBtn.innerText = `תרגול המילים שטעיתי (${missed.length})`;
            document.getElementById("all-words-btn").style.display = wordsData !== fullWords ? "" : "none";
            stepQuizResult(successRate, wordsData === fullWords);
            saveSession("summary");
        }

        // "→ תפריט" in the middle of a quiz: back to the main menu. The round is abandoned, so its points
        // are not added to the total (they are only added when a round is finished).
        async function leaveGame() {
            // freeze the quiz while the question is open (a right answer may be about to move on to the next word)
            const pending = nextQuestionTimer !== null, couldAnswer = canAnswer;
            clearTimeout(nextQuestionTimer); nextQuestionTimer = null;
            canAnswer = false;
            const leave = await askConfirm("לחזור לתפריט הראשי? הנקודות והתקדמות הבוחן הנוכחי לא יישמרו.", "חזרה לתפריט");
            if (!leave) {   // carry on where we were
                if (pending) { currentIndex++; loadQuestion(); } else canAnswer = couldAnswer;
                return;
            }
            try { speechSynthesis.cancel(); } catch (e) {}
            wordsData = fullWords;   // the menu always works with the whole list
            missed = [];
            showStart();
        }

        // New round with only the words that were answered wrong at least once
        function practiceMissed() {
            wordsData = missed.slice();
            restartGame();
        }

        // Back to the whole list after practising
        function playAll() {
            wordsData = fullWords;

        const CATS = {
            months: "january february march april may june july august september october november december".split(" "),
            days: "sunday monday tuesday wednesday thursday friday saturday".split(" "),
            numbers: "zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand a hundred".split(" ").concat(["a hundred"]),
            family: "mother father mom dad brother sister grandmother grandfather grandma grandpa aunt uncle cousin son daughter baby parents family".split(" "),
            animals: "animal dog cat horse cow sheep lion tiger elephant monkey bird fish rabbit mouse bear wolf turtle penguin kitten puppy duck chicken pig giraffe snake frog".split(" "),
            food: "cake candy bread milk cheese apple banana egg rice flour sugar salt pizza chocolate cookie ice cream sandwich soup meat fruit vegetable juice water".split(" "),
            house: "bathroom bedroom kitchen classroom dining room living room toilet bath floor wall roof door window sofa table chair bed flat building house garden".split(" "),
            colors: "red blue green yellow orange purple pink black white brown gray grey".split(" "),
            body: "head face eye ear nose mouth hand arm leg foot feet finger hair tooth teeth".split(" "),
            feelings: "happy sad angry scared tired hungry thirsty sorry sick excited bored".split(" "),
            music: "guitar piano song drum violin music sing hobby".split(" "),
            languages: "arabic hebrew english russian french spanish".split(" "),
            time: "year month week day hour minute second today tomorrow yesterday soon then when".split(" "),
            school: "student teacher subject study teach class book pen pencil school".split(" "),
            places: "market village beach farm hospital park city street israel outside".split(" ")
        };
        function catOf(word) {
            const w = word.toLowerCase().replace(/\(\w+\)/g, "").trim();
            for (const k in CATS) if (CATS[k].includes(w)) return k;
            return null;
        }

        const FALLBACK = "שולחן כיסא ספר חלון דלת בית כלב חתול מכונית עץ פרח שמש ירח כוכב נהר ים הר לחם חלב תפוח מים לרוץ ללכת לאכול לשתות לישון לכתוב לקרוא לשחק לשיר לצחוק לבכות לקפוץ לצייר לפתוח לסגור גדול קטן מהיר איטי חם קר חדש ישן".split(" ");

        function parseWords(text) {
            const rows = text.replace(/^\uFEFF/, '').split(/\r?\n/)
                .map(l => (l.includes("\t") ? l.split("\t") : l.split(/[,;]/)).map(x => x.replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "").trim()).filter(x => x))
                .filter(r => r.length >= 2);
            const pool = [], seen = new Set();
            for (const r of rows) {
                if (!seen.has(r[1])) { seen.add(r[1]); pool.push({ t: r[1], cat: catOf(r[0]), verb: r[1].startsWith("ל") }); }
            }
            for (const t of FALLBACK) if (!seen.has(t)) { seen.add(t); pool.push({ t, cat: null, verb: t.startsWith("ל") }); }
            const out = [];
            for (const r of rows) {
                const cat = catOf(r[0]), verb = r[1].startsWith("ל");
                const dynamics = [...new Set(r.slice(2))].filter(x => x !== r[1]).slice(0, 3);
                const score = x => (cat && x.cat === cat ? 4 : 0) + (x.verb === verb ? 2 : 0) + (!cat && !x.cat ? 1 : 0);
                const extra = shuffle(pool.filter(x => x.t !== r[1] && !dynamics.includes(x.t))).sort((p, q) => score(p) - score(q));
                while (dynamics.length < 3 && extra.length) dynamics.push(extra.pop().t);
                if (dynamics.length < 3) return { error: 'צריך לפחות 4 פירושים שונים (או 3 טעויות בכל שורה).' };
                out.push({ word: r[0], correct: r[1], dynamics });
            }
            if (!out.length) return { error: 'לא נמצאו מילים. פורמט: מילה, פירוש' };
            return { words: out };
        }

        function beginGame(words) {

        function startFromInput() {
            if (rows.some(r => !r.en.trim() !== !r.he.trim())) { document.getElementById("start-error").innerText = 'יש שורות שחסרים בהן מילה או פירוש.'; return; }
            const text = document.getElementById("words-input").value;
            const res = parseWords(text);
            if (res.error) { document.getElementById("start-error").innerText = res.error; return; }
            document.getElementById("words-input").value = text.replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "");
            renderWords();
            try { localStorage.setItem(storeKey(), document.getElementById("words-input").value); } catch (e) {}
            document.getElementById("start-error").innerText = "";
            stepQuiz = null;
            beginGame(res.words);
        }

        // In-app confirm dialog (the browser's confirm() shows the site's address)
        function askConfirm(text, okText) {
            return new Promise(resolve => {
                const bg = document.createElement("div");

                bg.innerHTML = `<div dir="rtl" style="background:#fff;color:#1a202c;border-radius:16px;padding:22px 20px 16px;max-width:320px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);">
                    <div data-text style="font-size:1.15rem;font-weight:bold;margin-bottom:18px;"></div>

        async function clearWords() {
            const box = document.getElementById("words-input");
            if (box.value.trim() && !(await askConfirm("למחוק את כל המילים מהרשימה?", "מחיקה"))) return;
            box.value = "";
            try { localStorage.removeItem(storeKey()); if (mode === "picture") localStorage.removeItem('englishpractice-words'); } catch (e) {}
            document.getElementById("photo-status").innerText = "";

        // ---- Word table: rows are the editable view; the hidden textarea #words-input stays the stored text ----
        let rows = [];   // { en, he, extra: [custom wrong answers kept as-is] }

        function loadRows() {
            const text = document.getElementById("words-input").value;
            rows = text.replace(/^﻿/, "").split(/\r?\n/)
                .map(l => (l.includes("\t") ? l.split("\t") : l.split(/[,;]/)).map(x => x.trim()))
                .filter(r => r.some(x => x))
                .map(r => ({ en: r[0] || "", he: r[1] || "", extra: r.slice(2).filter(x => x) }));
        }

        function saveRows() {
            const text = rows
                .filter(r => r.en.trim() || r.he.trim())
                .map(r => {
                    const cells = [r.en.trim(), r.he.trim(), ...r.extra];
                    while (cells.length > 1 && !cells[cells.length - 1]) cells.pop();
                    return cells.join("\t");   // tab-separated, so commas inside a meaning are kept as typed
                }).join("\n");
            document.getElementById("words-input").value = text;
            // keep the list on the device after every change, so a refresh never brings back old words
            try { localStorage.setItem(storeKey(), text); } catch (e) {}
            updateWordsCount();
        }

        function updateWordsCount() {
            const n = rows.filter(r => r.en.trim() && r.he.trim()).length;
            document.getElementById("words-count").textContent = n ? `${n} מילים ברשימה`
                : mode === "random" ? "אין מילים עדיין – לחצו על 🎲 לקבלת 20 מילים" : "אין מילים עדיין – הוסיפו מילה או צלמו תמונה";
            document.getElementById("words-hint").textContent = rows.some(isAutoMeaning) ? "🟨 תורגם אוטומטית – לחצו ▾ לפירוש אחר" : "";
        }

        function drawWords(focusIdx) {
            const t = document.getElementById("words-table");
            t.innerHTML = "";
            const hr = t.createTHead().insertRow();
            [["English", "left"], ["עברית", "right"], ["", "center"]].forEach(([label, align], i) => {
                const th = document.createElement("th");
                th.textContent = label;
                th.style.cssText = `position:sticky;top:0;z-index:2;box-shadow:0 1px 0 #cbd5e0;background:#edf2f7;padding:8px;font-size:0.9rem;color:#4a5568;text-align:${align};${i === 2 ? "width:44px;" : ""}`;
                hr.appendChild(th);
            });
            const body = t.createTBody();
            rows.forEach(r => buildWordRow(body, r));
            updateWordsCount();
            if (focusIdx != null && body.rows[focusIdx]) body.rows[focusIdx].cells[0].firstChild.focus();
        }

        function buildWordRow(body, r) {
            const tr = body.insertRow();
            tr.style.borderTop = "1px solid #e2e8f0";
            let heInp, altBtn;
            // light yellow = the meaning came from automatic translation and wasn't confirmed; ▾ only when there's a word
            const refresh = () => {
                const auto = isAutoMeaning(r);
                heInp.style.background = auto ? "#fffbea" : "";
                heInp.style.borderColor = auto ? "#ecc94b" : "#cbd5e0";
                altBtn.style.visibility = r.en.trim() ? "visible" : "hidden";
            };
            [["en", "ltr", "אנגלית"], ["he", "rtl", "עברית"]].forEach(([key, dir, label]) => {
                const td = tr.insertCell();
                td.style.cssText = "padding:4px;position:relative;";
                const inp = document.createElement("input");
                inp.value = r[key];
                inp.dir = dir;
                inp.setAttribute("aria-label", label);
                inp.autocomplete = "off";
                inp.style.cssText = "width:100%;box-sizing:border-box;padding:8px;font-size:1rem;border:1px solid #cbd5e0;border-radius:8px;" + (key === "he" ? "padding-left:32px;" : "");
                inp.addEventListener("input", () => { r[key] = inp.value; saveRows(); refresh(); });
                td.appendChild(inp);
                if (key === "he") {
                    heInp = inp;
                    // a meaning typed by hand counts as confirmed: remembered, so reading the same word again keeps it
                    inp.addEventListener("change", () => {
                        const en = r.en.trim().toLowerCase(), he = inp.value.trim();
                        if (en && he) { chosen[en] = he; try { localStorage.setItem(CH_KEY, JSON.stringify(chosen)); } catch (e) {} }
                        refresh();
                    });
                    altBtn = document.createElement("button");
                    altBtn.type = "button";
                    altBtn.textContent = "▾";
                    altBtn.setAttribute("aria-label", "פירושים נוספים");
                    altBtn.title = "פירושים נוספים";
                    altBtn.style.cssText = "position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1rem;color:#4a5568;cursor:pointer;padding:4px;";
                    altBtn.onclick = async () => {
                        const choice = await chooseMeaning(r.en.trim(), r.he.trim());
                        if (!choice) return;
                        r.he = choice; heInp.value = choice;
                        chosen[r.en.trim().toLowerCase()] = choice;   // remembered: the same word gets this meaning next time
                        try { localStorage.setItem(CH_KEY, JSON.stringify(chosen)); } catch (e) {}
                        saveRows(); refresh();
                    };
                    td.appendChild(altBtn);
                }
            });
            const td = tr.insertCell();
            td.style.cssText = "padding:4px;text-align:center;";
            const del = document.createElement("button");
            del.type = "button";
            del.textContent = "🗑️";
            del.setAttribute("aria-label", "מחיקת השורה");
            del.style.cssText = "font-size:1.2rem;background:none;border:none;cursor:pointer;padding:6px;";
            del.onclick = () => { rows.splice(rows.indexOf(r), 1); saveRows(); drawWords(); };
            td.appendChild(del);
            refresh();
        }

        // Re-read the stored text and redraw (call after changing #words-input programmatically)
        function renderWords() { loadRows(); drawWords(); }

        function speakWord() { speakText(document.getElementById("question-word").innerText.trim()); }
        function speakText(word) { speakTexts([word]); }
        // several English texts one after the other (e.g. the character's "Woof woof!" and then a word).
        // Returns a promise that resolves when the last one has been read (or after a time limit, as some phones
        // never report the end).
        function speakTexts(texts) {
            texts = texts.filter(Boolean);
            if (!texts.length || !("speechSynthesis" in window)) return Promise.resolve();
            speechSynthesis.cancel();
            const v = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
            return new Promise(resolve => {
                const limit = setTimeout(resolve, Math.min(8000, 1500 + texts.join(" ").length * 120));
                const done = () => { clearTimeout(limit); resolve(); };
                texts.forEach((t, k) => {
                    const u = new SpeechSynthesisUtterance(t);
                    u.lang = "en-US";
                    u.rate = 0.85;
                    if (v) u.voice = v;
                    if (k === texts.length - 1) { u.onend = done; u.onerror = done; }
                    speechSynthesis.speak(u);
                });
            });
        }
        if (!("speechSynthesis" in window)) document.addEventListener("DOMContentLoaded", () => { for (const id of ["speak-btn", "learn-speak"]) { const b = document.getElementById(id); if (b) b.style.display = "none"; } });

        function showStart() {
            stepQuiz = null;
            for (const id of ["summary-screen", "game-screen", "learn-screen", "learn-done-screen", "shop-screen"]) document.getElementById(id).style.display = "none";
            document.getElementById("start-screen").style.display = "flex";
            if (mode === "category") renderPath();
            saveSession("start");
        }

        let ocrWorker = null;

        function loadScript(src) {
            return new Promise((res, rej) => {
                const t = document.createElement("script");
                t.src = src; t.onload = res; t.onerror = () => rej(new Error("טעינת OCR נכשלה (צריך אינטרנט)"));
                document.head.appendChild(t);
            });
        }

        async function getWorker() {
            if (ocrWorker) return ocrWorker;
            if (!window.Tesseract) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js");
            ocrWorker = await Tesseract.createWorker("eng+heb+ara");
            return ocrWorker;
        }

        function drawRotated(bmp, deg) {
            const scale = Math.min(1.5, 2200 / Math.max(bmp.width, bmp.height));
            const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
            const c = document.createElement("canvas");
            const swap = deg === 90 || deg === 270, pad = Math.round(Math.max(w, h) * 0.04);
            c.width = (swap ? h : w) + 2 * pad; c.height = (swap ? w : h) + 2 * pad;
            const x = c.getContext("2d");
            x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
            x.translate(c.width / 2, c.height / 2);
            x.rotate(deg * Math.PI / 180);
            x.drawImage(bmp, -w / 2, -h / 2, w, h);
            return c;
        }

        // Local-contrast black/white: removes shadows and text showing through from the other side of the page.
        function binarize(canvas) {
            const W = canvas.width, H = canvas.height, ctx = canvas.getContext("2d");
            const img = ctx.getImageData(0, 0, W, H), d = img.data;
            const g = new Float32Array(W * H), I = new Float64Array((W + 1) * (H + 1));
            for (let i = 0; i < W * H; i++) g[i] = (d[i * 4] * 3 + d[i * 4 + 1] * 6 + d[i * 4 + 2]) / 10;
            for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += g[y * W + x]; I[(y + 1) * (W + 1) + x + 1] = I[y * (W + 1) + x + 1] + row; } }
            const r = Math.max(10, Math.round(Math.max(W, H) / 40));
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1), y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
                const mean = (I[y1 * (W + 1) + x1] - I[y0 * (W + 1) + x1] - I[y1 * (W + 1) + x0] + I[y0 * (W + 1) + x0]) / ((x1 - x0) * (y1 - y0));
                const v = g[y * W + x] < mean * 0.85 ? 0 : 255, k = (y * W + x) * 4;
                d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255;
            }
            ctx.putImageData(img, 0, 0);
            return canvas;
        }

        // Returns the photo in black/white. If it has a framed box (e.g. "New Words"), only the inside of the box
        // is kept (everything outside painted white, cropped to the box).
        function boxOnly(bmp) {
            const full = document.createElement("canvas");
            const fs = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
            full.width = Math.round(bmp.width * fs); full.height = Math.round(bmp.height * fs);
            full.getContext("2d").drawImage(bmp, 0, 0, full.width, full.height);
            // the same picture before black/white: doubtful Hebrew words are read again from it (see itemsFromPage)
            const gray = document.createElement("canvas"); gray.width = full.width; gray.height = full.height;
            gray.getContext("2d").drawImage(full, 0, 0);
            full.gray = gray;
            binarize(full);

            const sc = Math.min(1, 700 / Math.max(full.width, full.height));
            const W = Math.round(full.width * sc), H = Math.round(full.height * sc);
            const small = document.createElement("canvas"); small.width = W; small.height = H;
            small.getContext("2d").drawImage(full, 0, 0, W, H);
            const px = small.getContext("2d").getImageData(0, 0, W, H).data;
            // dark pixels, slightly thickened so a thin frame stays connected
            const dark = new Uint8Array(W * H);
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (px[(y * W + x) * 4] < 128)
                for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                    const yy = y + dy, xx = x + dx;
                    if (yy >= 0 && yy < H && xx >= 0 && xx < W) dark[yy * W + xx] = 1;
                }
            // connected components; the frame = a big, thin one
            const lab = new Int32Array(W * H), stack = [];
            let best = null, n = 0;
            for (let i = 0; i < W * H; i++) if (dark[i] && !lab[i]) {
                n++; let cnt = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
                lab[i] = n; stack.push(i);
                while (stack.length) {
                    const j = stack.pop(), x = j % W, y = (j - x) / W; cnt++;
                    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
                    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                        const yy = y + dy, xx = x + dx, k = yy * W + xx;
                        if (yy >= 0 && yy < H && xx >= 0 && xx < W && dark[k] && !lab[k]) { lab[k] = n; stack.push(k); }
                    }
                }
                const area = (x1 - x0 + 1) * (y1 - y0 + 1);
                if (area > 0.15 * W * H && cnt / area < 0.2 && (!best || area > best.area)) best = { id: n, area };
            }
            if (!best) return full;
            // Inside the box = no frame between the spot and the middle of the box. This also works when the frame
            // runs off the photo or fades out on one side, and when a finger touches the frame.
            // The middle: centre of the area that has the frame on at least 3 of its 4 sides.
            const isF = i => lab[i] === best.id, hits = new Uint8Array(W * H);
            const scan = (outerN, innerN, idx) => {
                for (let o = 0; o < outerN; o++) {
                    let hit = 0;
                    for (let t = 0; t < innerN; t++) { const i = idx(o, t); if (isF(i)) hit = 1; else hits[i] += hit; }
                    hit = 0;
                    for (let t = innerN - 1; t >= 0; t--) { const i = idx(o, t); if (isF(i)) hit = 1; else hits[i] += hit; }
                }
            };
            scan(W, H, (x, y) => y * W + x);
            scan(H, W, (y, x) => y * W + x);
            let mx = 0, my = 0, mn = 0;
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (hits[y * W + x] >= 3) { mx += x; my += y; mn++; }
            if (mn < 0.1 * W * H) return full;
            mx /= mn; my /= mn;
            // walk from the middle to every pixel on the photo's edge; everything up to the frame is inside
            const votes = new Uint8Array(W * H);   // 3 = inside, 0 = outside
            const walk = (ex, ey) => {
                const steps = Math.ceil(2 * Math.max(Math.abs(ex - mx), Math.abs(ey - my)));
                for (let s = 0; s <= steps; s++) {
                    const i = Math.round(my + (ey - my) * s / steps) * W + Math.round(mx + (ex - mx) * s / steps);
                    if (isF(i)) return;
                    votes[i] = 3;
                }
            };
            for (let x = 0; x < W; x++) { walk(x, 0); walk(x, H - 1); }
            for (let y = 0; y < H; y++) { walk(0, y); walk(W - 1, y); }
            let bx0 = W, bx1 = 0, by0 = H, by1 = 0, inside = 0;
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (votes[y * W + x] >= 3) {
                inside++; if (x < bx0) bx0 = x; if (x > bx1) bx1 = x; if (y < by0) by0 = y; if (y > by1) by1 = y;
            }
            if (inside < 0.1 * W * H) return full;
            // white overlay for everything outside the box
            const ov = document.createElement("canvas"); ov.width = W; ov.height = H;
            const oc = ov.getContext("2d"), od = oc.createImageData(W, H);
            for (let i = 0; i < W * H; i++) if (votes[i] < 3) { od.data[i * 4] = od.data[i * 4 + 1] = od.data[i * 4 + 2] = 255; od.data[i * 4 + 3] = 255; }
            oc.putImageData(od, 0, 0);
            const fc = full.getContext("2d");
            fc.imageSmoothingEnabled = false;
            fc.drawImage(ov, 0, 0, full.width, full.height);

            const ar = lines.flatMap(l => l.words).filter(w => /[؀-ۿ]/.test(w.text)).map(w => ({ y0: w.bbox.y0, y1: w.bbox.y1 }));

        const sameRowY = (a, b) => Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) >= 0.5 * Math.min(a.y1 - a.y0, b.y1 - b.y0);

        // Returns those rows as { y0, y1, segs } so they can be read again as Hebrew only.

        async function ocrPhoto(file, status) {

                .replace(/[֑-ׇ]/g, "").replace(/\s*[\(\[（][^)\]）]*[\)\]）]/g, "").replace(/[,;]/g, " /").replace(/[.!?]+$/, "").trim();

                cancel.style.cssText = "margin-top:12px;width:100%;padding:10px;font-size:1rem;border:none;border-radius:10px;background:#e2e8f0;color:#2d3748;cursor:pointer;";
                const done = v => { bg.remove(); resolve(v); };
                cancel.onclick = () => done(null);
                bg.onclick = e => { if (e.target === bg) done(null); };
                box.append(title, sub, body, cancel);
                bg.appendChild(box);
                document.body.appendChild(bg);
                fetchAlternatives(en).then(groups => {
                    body.textContent = "";
                    if (!groups.length) { body.textContent = "לא נמצאו פירושים נוספים."; return; }
                    for (const g of groups) {
                        if (g.pos) {
                            const label = document.createElement("div");
                            label.textContent = g.pos;
                            label.style.cssText = "font-size:0.8rem;color:#718096;margin:8px 0 4px;";
                            body.appendChild(label);
                        }
                        const wrap = document.createElement("div");
                        wrap.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;";
                        for (const t of g.terms) {
                            const b = document.createElement("button");
                            b.type = "button";
                            b.textContent = t;
                            b.style.cssText = `padding:8px 12px;font-size:1rem;border:none;border-radius:10px;cursor:pointer;background:${t === current ? "#bee3f8" : "#e2e8f0"};color:#2d3748;`;
                            b.onclick = () => done(t);
                            wrap.appendChild(b);
                        }
                        body.appendChild(wrap);
                    }
                }).catch(() => { body.textContent = "לא הצלחנו לטעון פירושים – בדקו את החיבור לאינטרנט."; });
            });
        }

        async function translateWithRetry(word) {
            const key = word.toLowerCase();
            if (chosen[key]) return chosen[key];
            if (trCache[key]) return trCache[key];
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const t = await translate(word);
                    if (t !== word) { trCache[key] = t; try { localStorage.setItem(TR_KEY, JSON.stringify(trCache)); } catch (e) {} }
                    return t;
                } catch (err) {
                    if (/מכסת/.test(err.message)) throw err;
                    await new Promise(res => setTimeout(res, 700 * (attempt + 1)));
                }
            }
            return null;
        }

        // ---- Random words from the built-in word bank: wordbank/level-1.txt ... level-9.txt, "english|hebrew" per line.
        // Levels 1-2 are for young children and are split into small topic groups with "# topic" header lines (skipped here).
        // The level numbers changed when levels 1-2 were added, so the saved choice uses a new key.
        const LEVEL_COUNT = 9;
        const LEVEL_KEY = 'englishquiz-level-v2';
        const levelCache = {};
        async function loadLevel(level) {
            if (levelCache[level]) return levelCache[level];
            const res = await fetch(`wordbank/level-${level}.txt`, { cache: "no-cache" });   // never an old copy from the browser cache
            if (!res.ok) throw new Error("לא נטען");
            const text = new TextDecoder("utf-8").decode(await res.arrayBuffer());
            const words = [];
            let cat = "";   // '# name' lines start a category; the words under it belong to it
            for (const line of text.split(/\r?\n/)) {
                if (line.startsWith("#")) { cat = line.slice(1).trim(); continue; }
                const p = line.split("|");
                // an optional 3rd field is a picture (emoji) for the word, shown on its learning card
                if (p.length >= 2 && p[0].trim() && p[1].trim()) words.push({ en: p[0].trim(), he: p[1].trim(), cat, pic: (p[2] || "").trim() });
            }
            return (levelCache[level] = words);
        }

        // the random tab and the learning tab share one chosen level
        function saveLevel(from) {
            const v = (from || document.getElementById("level-select")).value;
            for (const id of ["level-select", "cat-level-select"]) document.getElementById(id).value = v;
            try { localStorage.setItem(LEVEL_KEY, v); } catch (e) {}
            if (from && from.id === "cat-level-select") renderPath();
        }

        // Puts 20 random words of the chosen level into the table (the student can still edit before starting).
        async function randomWords() {
            const level = +document.getElementById("level-select").value;
            const status = document.getElementById("random-status");
            status.textContent = "";
            let words;
            try { words = await loadLevel(level); }
            catch (e) { status.textContent = "לא הצלחנו לטעון את מאגר המילים – בדקו את החיבור לאינטרנט."; return; }
            if (rows.some(r => r.en.trim() || r.he.trim()) && !(await askConfirm("להחליף את הרשימה הנוכחית ב-20 מילים אקראיות?", "החלפה"))) return;
            const picked = shuffle(words.slice()).slice(0, 20);
            // a meaning picked by hand earlier (▾) wins over the bank's default
            rows = picked.map(w => ({ en: w.en, he: chosen[w.en.toLowerCase()] || w.he, extra: [] }));
            saveRows();
            drawWords();
            document.getElementById("start-error").innerText = "";
            status.textContent = `נבחרו ${picked.length} מילים מרמה ${level}. לחצו "התחל משחק".`;
        }

        document.getElementById("cat-level-select").innerHTML = document.getElementById("level-select").innerHTML;
        try { const lv = localStorage.getItem(LEVEL_KEY); if (lv) document.getElementById("level-select").value = lv; } catch (e) {}
        document.getElementById("cat-level-select").value = document.getElementById("level-select").value;
        // once, in the background: fetch all levels so the service worker keeps them for offline use
        window.addEventListener("load", () => setTimeout(() => {
            try { if (localStorage.getItem("englishquiz-bank-cached-v2") === "1") return; } catch (e) {}
            Promise.all(Array.from({ length: LEVEL_COUNT }, (_, i) => fetch(`wordbank/level-${i + 1}.txt`).then(r => { if (!r.ok) throw 0; })))
                .then(() => { try { localStorage.setItem("englishquiz-bank-cached-v2", "1"); } catch (e) {} }).catch(() => {});
        }, 3000));

        document.getElementById("photo-input").addEventListener("change", async e => {
            const files = [...e.target.files];
            const status = document.getElementById("photo-status");
            const box = document.getElementById("words-input");
            if (!files.length) return;
            const startBtn = document.getElementById("start-btn");
            startBtn.disabled = true;
            document.querySelectorAll(".tab-btn").forEach(b => b.disabled = true);   // stay on this tab until the photo is done
            let failed = 0;
            try {
                for (let i = 0; i < files.length; i++) {
                    status.innerText = `תמונה ${i + 1}/${files.length}: טוען OCR...`;
                    const items = [], byEn = {};
                    for (const it of await ocrPhoto(files[i], status)) {
                        const key = it.en.toLowerCase();
                        if (!(key in byEn)) { byEn[key] = items.length; items.push(it); }
                        else if (!items[byEn[key]].he) items[byEn[key]].he = it.he;
                    }
                    const out = new Array(items.length);
                    let next = 0, done = 0;
                    const run = async () => {
                        while (next < items.length) {
                            const k = next++;
                            let t = items[k].he;
                            if (!t) { t = await translateWithRetry(items[k].en); if (t === null) failed++; }
                            out[k] = `${items[k].en}\t${t === null ? "" : (t || items[k].en)}`;   // no answer -> blank cell to fill in
                            status.innerText = `מתרגם ${++done}/${items.length}...`;
                        }
                    };
                    await Promise.all([run(), run(), run(), run()]);
                    const have = new Set(box.value.split(/\r?\n/).map(l => l.trim()));
                    const add = out.filter(l => l && !have.has(l));
                    box.value = (box.value.trim() ? box.value.trim() + "\n" : "") + add.join("\n");
                    renderWords();
                    saveRows();   // keep the words from the photo on the device right away
                }
                status.innerText = failed
                    ? `מוכן! ${failed} מילים לא תורגמו (שירות התרגום עמוס) – השלימו אותן ידנית בטבלה, או נסו שוב עוד רגע.`
                    : "מוכן! בדקו את הרשימה ולחצו התחל.";

            } finally {

            }
