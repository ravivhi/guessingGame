        });


        // ---- 📚 Learning path. Each level's categories in file order; a big category is split into parts of
        // up to 15 words. Learning = cards with the English word (read aloud) and its Hebrew meaning together,
        // then a short quiz on those words; finishing it with no mistakes marks the part as passed (green).
        // Every part is open - learn or take the quiz of any part, in any order, any time.
        const LEARN_KEY = "englishquiz-learn-progress";   // { level: [indexes of the passed parts] }
        const PART_MAX = 15;
        let learnProgress = {};
        try { learnProgress = JSON.parse(localStorage.getItem(LEARN_KEY)) || {}; } catch (e) {}
        // older versions saved how many parts were passed in order (a number): those are the first N parts
        function passedSet(level) {
            const v = learnProgress[level];
            return new Set(Array.isArray(v) ? v : Array.from({ length: Math.max(0, +v || 0) }, (_, i) => i));
        }
        const CAT_EMOJIS = [
            [/מקצועות לימוד|בית ספר|בית הספר|חינוך|למידה|קריאה וכתיבה/, "🏫"], [/ברכות/, "👋"], [/מספרים/, "🔢"],
            [/צבעים/, "🎨"], [/משפחה/, "👨‍👩‍👧"], [/חיות מחמד/, "🐶"], [/חיות בר/, "🦁"], [/צמחים/, "🌱"], [/בעלי חיים/, "🐾"],
            [/פירות/, "🍓"], [/ירקות/, "🥕"], [/משקאות/, "🥤"], [/אוכל|בישול/, "🍕"], [/בגדים/, "👕"], [/צעצועים/, "🧸"],
            [/תחבורה/, "🚗"], [/מזג אוויר/, "🌦️"], [/כדור הארץ/, "🌍"], [/סביבה/, "♻️"], [/טבע/, "🌳"], [/אגדות|קסמים|סיפורים/, "🧚"],
            [/מילות מקום|איפה/, "📍"], [/מקומות|העיר|עיר|קהילה/, "🏙️"], [/חפצים בבית|הבית|בבית|בית ומטבח|בית וחיי/, "🏠"],
            [/ימים|זמן/, "⏰"], [/מקצועות|עבודה|קריירה/, "👷"], [/ספורט/, "⚽"], [/רגשות|מצבי רוח/, "😊"], [/מוזיקה|חגיגות|אירועים/, "🎉"],
            [/טיולים/, "🧳"], [/מחשבים|טכנולוגיה/, "💻"], [/מדיה|תקשורת/, "📰"], [/כסף|כלכלה|עסקים|קניות/, "💰"], [/החלל/, "🚀"],
            [/מדע|מחקר/, "🔬"], [/מתמטיקה|צורות|כמות/, "📐"], [/בריאות|רפואה|הגוף|גוף/, "🩺"], [/היסטוריה/, "🏛️"], [/חוק|משפט/, "⚖️"],
            [/ממשל|פוליטיקה|בחירות/, "🗳️"], [/ספרות|אמנות|תרבות/, "🎭"], [/חשיבה|רעיונות|גילוי|טיעון/, "💡"], [/אופי|אישיות|התנהגות|ערכים/, "🌟"],
            [/מלחמה|ביטחון|עימותים/, "🛡️"], [/חברה|אנשים|יחסים/, "🤝"], [/דת/, "🕊️"], [/שינוי/, "🔄"], [/חומרים/, "🧰"],
            [/מילות קישור/, "🔗"], [/פעלים|פעולות|עושים/, "🏃"], [/תיאור/, "✨"], [/מילים קטנות|שמות עצם/, "🔤"],
        ];
        function catEmoji(name) { for (const [re, e] of CAT_EMOJIS) if (re.test(name)) return e; return "📘"; }

        function learnSteps(words) {
            const cats = [];
            for (const w of words) {
                if (!cats.length || cats[cats.length - 1].key !== w.cat) cats.push({ key: w.cat, name: w.cat || "מילים", words: [] });
                cats[cats.length - 1].words.push(w);
            }
            const steps = [];
            for (const c of cats) {
                const parts = Math.ceil(c.words.length / PART_MAX), size = Math.ceil(c.words.length / parts);
                for (let p = 0; p < parts; p++) steps.push({ name: c.name, part: parts > 1 ? p + 1 : 0, parts, words: c.words.slice(p * size, (p + 1) * size) });
            }
            return steps;
        }
        const stepLabel = s => s.name + (s.part ? ` (${s.part}/${s.parts})` : "");

        let pathToken = 0;
        async function renderPath() {
            const level = +document.getElementById("cat-level-select").value, token = ++pathToken;
            const list = document.getElementById("cat-list"), status = document.getElementById("cat-status");
            status.textContent = "";
            let words;
            try { words = await loadLevel(level); }
            catch (e) { if (token === pathToken) { list.innerHTML = ""; status.textContent = "לא הצלחנו לטעון את מאגר המילים – בדקו את החיבור לאינטרנט."; } return; }
            if (token !== pathToken) return;   // the level was changed meanwhile
            const steps = learnSteps(words), passed = passedSet(level);
            list.innerHTML = "";
            // each row: the part (green with ✅ once its quiz was passed), a 📖 learn button and a 📝 quiz button
            const rowButton = (cls, icon, label, aria, onclick) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "cat-btn " + cls;
                btn.innerHTML = '<span class="cat-btn-icon"></span><span></span>';
                btn.firstChild.textContent = icon;
                btn.lastChild.textContent = label;
                btn.setAttribute("aria-label", aria);
                btn.onclick = onclick;
                return btn;
            };
            steps.forEach((s, i) => {
                const done = passed.has(i);
                const card = document.createElement("div");
                card.className = "cat-step" + (done ? " done" : "");
                card.innerHTML = '<span class="cat-emoji"></span><span class="cat-text"><span class="cat-name"></span><span class="cat-meta"></span></span><span class="cat-state"></span>';
                card.querySelector(".cat-emoji").textContent = catEmoji(s.name);
                card.querySelector(".cat-name").textContent = `${i + 1}. ${s.name}`;
                card.querySelector(".cat-meta").textContent = (s.part ? `חלק ${s.part} מתוך ${s.parts} · ` : "") + `${s.words.length} מילים`;
                card.querySelector(".cat-state").textContent = done ? "✅" : "";
                const row = document.createElement("div");
                row.className = "cat-row";
                row.append(card,
                    rowButton("cat-learn", "📖", "לימוד", `לימוד: ${s.name}`, () => startLearning(level, i)),
                    rowButton("cat-quiz", "📝", "בוחן", `בוחן: ${s.name}`, () => quizStep(level, i)));
                list.appendChild(row);
            });
            const count = steps.filter((s, i) => passed.has(i)).length;
            document.getElementById("path-progress").textContent = `⭐ ${count}/${steps.length}`;
            const first = steps.findIndex((s, i) => !passed.has(i));   // the first part not passed yet, in view
            const cur = list.children[first < 0 ? steps.length - 1 : first];
            if (cur) list.scrollTop = Math.max(0, cur.offsetTop - list.offsetTop - list.clientHeight / 3);
        }

        let learn = null;   // { level, index, steps, step, i }
        const learnWord = () => learn.step.words[learn.i];
        async function startLearning(level, index) {
            let words;
            try { words = await loadLevel(level); } catch (e) { return; }
            const steps = learnSteps(words);
            if (!steps[index]) return;
            learn = { level, index, steps, step: steps[index], i: 0 };
            for (const id of ["start-screen", "learn-done-screen", "summary-screen", "game-screen"]) document.getElementById(id).style.display = "none";
            document.getElementById("learn-screen").style.display = "flex";
            showCard();
        }

        function updateLearnNav() {
            const n = learn.step.words.length, last = learn.i === n - 1;
            document.getElementById("learn-prev").disabled = learn.i === 0;
            document.getElementById("learn-next").textContent = last ? "🏁 סיום" : "הבא ←";
            document.getElementById("learn-bar-fill").style.width = `${((learn.i + 1) / n) * 100}%`;
        }

        function showCard() {
            const s = learn.step, w = learnWord(), card = document.getElementById("learn-card");
            card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");   // a small pop for each new card
            document.getElementById("learn-title").textContent = `${catEmoji(s.name)} ${stepLabel(s)}`;
            document.getElementById("learn-count").textContent = `${learn.i + 1}/${s.words.length}`;
            document.getElementById("learn-emoji").textContent = w.pic || catEmoji(s.name);   // the word's own picture, else its category's
            document.getElementById("learn-word").textContent = w.en;
            document.getElementById("learn-meaning").textContent = chosen[w.en.toLowerCase()] || w.he;
            updateLearnNav();
            speakText(w.en);
            saveSession("learn");
        }

        function learnStep(d) {
            if (d > 0 && learn.i === learn.step.words.length - 1) return finishLearning();
            learn.i = Math.max(0, Math.min(learn.step.words.length - 1, learn.i + d));
            showCard();
        }

        function finishLearning() {
            const { index, steps } = learn;
            try { speechSynthesis.cancel(); } catch (e) {}
            document.getElementById("learn-screen").style.display = "none";
            document.getElementById("learn-done-screen").style.display = "block";
            document.getElementById("learn-done-text").textContent = `סיימתם ללמוד: ${catEmoji(steps[index].name)} ${stepLabel(steps[index])}`;
            saveSession("learn-done");
        }

        // ---- The quiz at the end of each step of the learning path: the step's words, wrong answers from the
        // same category. Only a quiz with no mistakes (every word right on the first try) opens the next step.
        const STEP_PASS = 100;
        let stepQuiz = null;   // { level, index, steps } while a step's quiz is played

        // "📝 בוחן" next to an open step on the path: straight to its quiz, without the cards (passing it opens the next step as usual)
        async function quizStep(level, index) {
            let words;
            try { words = await loadLevel(level); } catch (e) { return; }
            const steps = learnSteps(words);
            if (!steps[index]) return;
            learn = { level, index, steps, step: steps[index], i: 0 };
            document.getElementById("start-screen").style.display = "none";
            startStepQuiz();
        }

        function startStepQuiz() {
            const { level, index, steps } = learn, step = steps[index];
            const meaning = w => chosen[w.en.toLowerCase()] || w.he;
            const catWords = steps.filter(s => s.name === step.name).flatMap(s => s.words);   // all parts of the category
            const levelWords = steps.flatMap(s => s.words);
            const game = step.words.map(w => {
                const right = meaning(w), wrong = [];
                for (const pool of [step.words, catWords, levelWords]) {   // closest first: this step, its category, the level
                    for (const t of shuffle([...new Set(pool.map(meaning))])) if (wrong.length < 3 && t !== right && !wrong.includes(t)) wrong.push(t);
                }
                return { word: w.en, correct: right, dynamics: wrong };
            });
            stepQuiz = { level, index, steps };
            document.getElementById("learn-done-screen").style.display = "none";
            beginGame(game);
        }

        // A short happy jingle (made in the browser, no sound file, works offline): four rising notes, then a sparkle.
        let audioCtx = null;
        function playUnlockSound() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === "suspended") audioCtx.resume();
                const t0 = audioCtx.currentTime + 0.05;
                const note = (freq, start, dur, vol = 0.22) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = "triangle";
                    o.frequency.value = freq;
                    g.gain.setValueAtTime(0.0001, start);
                    g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                    o.connect(g).connect(audioCtx.destination);
                    o.start(start);
                    o.stop(start + dur + 0.05);
                };
                [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, t0 + i * 0.11, 0.2));   // C E G C
                note(1046.5, t0 + 0.48, 0.6, 0.18); note(1318.5, t0 + 0.48, 0.6, 0.14); note(1568, t0 + 0.56, 0.5, 0.1);   // sparkle
            } catch (e) {}
        }

        // 🎆 Fireworks over the whole screen for a few seconds (a canvas that doesn't catch taps, removed at the end)
        function fireworks(duration = 3500) {
            const cv = document.createElement("canvas");
            cv.id = "fireworks";
            cv.setAttribute("aria-hidden", "true");
            cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1500;";
            document.body.appendChild(cv);
            const ctx = cv.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
            const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
            const colors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93", "#ff924c", "#f15bb5", "#00f5d4", "#fff"];
            const rockets = [], sparks = [], t0 = performance.now();
            let nextLaunch = 0;
            const launch = () => rockets.push({ x: W * (0.15 + Math.random() * 0.7), y: H, vx: (Math.random() - 0.5) * 2 * dpr,
                vy: -(H * 0.016 + Math.random() * H * 0.005), top: H * (0.12 + Math.random() * 0.3), color: colors[Math.floor(Math.random() * colors.length)] });
            const burst = r => {
                const n = 45 + Math.floor(Math.random() * 25), speed = (2.2 + Math.random() * 2) * dpr;
                for (let k = 0; k < n; k++) {
                    const a = (Math.PI * 2 * k) / n, v = speed * (0.6 + Math.random() * 0.5);
                    sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, color: Math.random() < 0.25 ? "#fff" : r.color });
                }
            };
            const frame = now => {
                const t = now - t0;
                if (t < duration - 1200 && t >= nextLaunch) { launch(); if (Math.random() < 0.4) launch(); nextLaunch = t + 280 + Math.random() * 260; }
                ctx.globalCompositeOperation = "destination-out";   // fade the last frame: short trails
                ctx.fillStyle = "rgba(0,0,0,0.25)";
                ctx.fillRect(0, 0, W, H);
                ctx.globalCompositeOperation = "lighter";
                for (let k = rockets.length - 1; k >= 0; k--) {
                    const r = rockets[k];
                    r.x += r.vx; r.y += r.vy; r.vy += 0.12 * dpr;
                    ctx.fillStyle = r.color;
                    ctx.beginPath(); ctx.arc(r.x, r.y, 2.2 * dpr, 0, Math.PI * 2); ctx.fill();
                    if (r.y <= r.top || r.vy >= 0) { burst(r); rockets.splice(k, 1); }
                }
                for (let k = sparks.length - 1; k >= 0; k--) {
                    const s = sparks[k];

                    ctx.beginPath(); ctx.arc(s.x, s.y, 2 * dpr, 0, Math.PI * 2); ctx.fill();

        // called by showSummary: in a step's quiz, a full round with no mistakes marks the step as passed (green)
        function stepQuizResult(rate, fullRound) {
            const res = document.getElementById("step-result"), nextBtn = document.getElementById("next-step-btn");
            document.getElementById("change-words-btn").textContent = stepQuiz ? "🗺️ חזרה למסלול" : "החלפת מילים";
            res.style.display = nextBtn.style.display = "none";
            if (!stepQuiz) return;
            const { level, index, steps } = stepQuiz, passedSteps = passedSet(level), wasPassed = passedSteps.has(index);
            const passed = fullRound && rate >= STEP_PASS;
            learn = { level, index, steps, step: steps[index], i: 0 };   // so "next topic" knows where we are
            if (passed && !wasPassed) {
                passedSteps.add(index);
                learnProgress[level] = [...passedSteps].sort((a, b) => a - b);
                try { localStorage.setItem(LEARN_KEY, JSON.stringify(learnProgress)); } catch (e) {}
                playUnlockSound();   // the step just turned green
            }
            const allPassed = steps.every((s, i) => passedSteps.has(i));
            res.style.display = "";
            if (passed) {
                fireworks();   // 🎆 the topic's quiz is done
                res.style.color = "#2f855a";
                res.textContent = wasPassed ? "✅ עברתם את הבוחן!" : allPassed ? `🏆 עברתם את כל הנושאים ברמה ${level}!` : "✅ עברתם את הנושא! הוא מסומן עכשיו בירוק";
            } else if (wasPassed) res.style.display = "none";   // already green: nothing to add
            else {
                res.style.color = "#c05621";
                res.textContent = fullRound ? "כדי שהנושא יסומן בירוק צריך לענות על כל הבוחן בלי טעויות – נסו שוב! 💪" : "עכשיו נסו את כל הבוחן שוב 💪";
            }
            // nothing is locked: the next topic (or level) is always there
            const next = steps[index + 1];

            avatarTaps = (Date.now() - avatarLastTap > 6000 ? 0 : avatarTaps) + 1;
            el.getAnimations().forEach(x => x.cancel());
            const moved = anim => anim.finished.catch(() => {});
            if (avatarTaps >= 5) {   // the 5th tap in a row: dizzy!
                avatarTaps = 0;
                avatarWord = null;
                const spin = el.animate(AVATAR_MOVES.dizzy, { duration: 1400, easing: "ease-in-out" });
                avatarBurst(["💫", "⭐", "😵‍💫"], 12);
                showAvatarBubble(`${a.pic} Whoa, I'm dizzy!`, "😵‍💫", "וואו, הסתחררתי!", "");
                await Promise.all([moved(spin), speakTexts(["Whoa, I'm dizzy!"])]);
                return;
            }
            const move = el.animate(AVATAR_MOVES[fx.move] || AVATAR_MOVES.hop, { duration: fx.move === "spin" || fx.move === "flip" ? 700 : 900, easing: "ease-in-out" });
            avatarBurst(fx.fx);
            let words;
            try { words = await loadLevel(+document.getElementById("level-select").value); } catch (e) { words = AVATAR_WORDS; }
            if (!words.length) words = AVATAR_WORDS;
            let w;
            do { w = words[Math.floor(Math.random() * words.length)]; } while (words.length > 1 && avatarWord && w.en === avatarWord.en);   // not the same word twice in a row
            avatarWord = w;
            showAvatarBubble(`${a.pic} ${fx.say}`, (w.pic ? w.pic + " " : "") + w.en, chosen[w.en.toLowerCase()] || w.he, "🔊 לחצו לשמוע שוב");
            await Promise.all([moved(move), speakTexts([fx.say, w.en])]);
        }

        function avatarBubbleTap() {
            if (document.getElementById("menu-avatar").disabled) return;   // not while the character is still talking
            if (avatarWord) speakText(avatarWord.en);
            clearTimeout(bubbleTimer);
            bubbleTimer = setTimeout(() => document.getElementById("avatar-bubble").classList.remove("on"), 6000);
        }

        function openShop() {
            shopConfirm = null;
            document.getElementById("shop-msg").textContent = "";
            document.getElementById("box-pic").textContent = "🎁";
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("shop-screen").style.display = "flex";
            renderShop();
            saveSession("shop");
        }

        function renderShop() {
            document.getElementById("shop-balance").textContent = `⭐ ${grandTotal}`;
            const boxes = shop.boxes || 0;
            document.getElementById("box-count").textContent = boxes ? `יש לכם ${boxes} ${boxes === 1 ? "קופסה" : "קופסאות"}!` : "אין לכם קופסה עדיין";
            document.getElementById("box-hint").textContent = `מגיעים לפרצוף האחרון = קופסה! עוד ${Math.max(0, BOX_GOAL - streak)} נכונות ברצף`;
            const stage = streakStage(streak), faces = document.getElementById("shop-faces");   // faces 1..current stage
            faces.innerHTML = "";
            STREAK_EMOJIS.forEach((e, i) => {
                const d = document.createElement("div");
                d.className = "face" + (i < stage ? (i === stage - 1 ? " current" : "") : " missing");
                d.textContent = i < stage ? e : "❓";
                faces.appendChild(d);
            });
            document.getElementById("faces-count").textContent = `(${stage}/${STREAK_EMOJIS.length})`;
            const aw = document.getElementById("shop-awards"), mine = shop.awards || {};   // the collection; missing ones as ❓
            aw.innerHTML = "";
            for (const a of SHOP_AWARDS) {
                const d = document.createElement("div");
                d.className = "award" + (mine[a.id] ? "" : " missing");
                d.dataset.id = a.id;
                d.title = mine[a.id] ? a.name : "עוד לא נמצא";
                d.textContent = mine[a.id] ? a.pic : "❓";
                if (mine[a.id] > 1) { const n = document.createElement("span"); n.className = "award-n"; n.textContent = "×" + mine[a.id]; d.appendChild(n); }
                aw.appendChild(d);
            }
            document.getElementById("box-open").disabled = !boxes;
            const fill = (boxId, items, kind) => {
                const box = document.getElementById(boxId);
                box.innerHTML = "";
                for (const it of items) {
                    const owned = shop.owned.includes(it.id), active = kind === "avatar" ? shop.avatar === it.id : shop.theme === it.id;
                    const b = document.createElement("button");
                    b.type = "button";
                    b.className = "shop-item" + (active ? " active" : owned ? " owned" : grandTotal < it.price ? " poor" : "") + (shopConfirm === it.id ? " confirm" : "");
                    b.dataset.id = it.id;
                    const pic = document.createElement("div");
                    if (kind === "avatar") { pic.className = "shop-pic"; pic.textContent = it.pic; }
                    else { pic.className = "shop-swatch"; pic.style.background = it.bg; }
                    const name = document.createElement("div");
                    name.className = "shop-name"; name.textContent = it.name;
                    const price = document.createElement("div");
                    price.className = "shop-price";
                    price.textContent = active ? "✔ בשימוש" : owned ? "שלי – לבחירה" : shopConfirm === it.id ? "לקנות? ✔" : `⭐ ${it.price}`;
                    b.append(pic, name, price);
                    b.onclick = () => shopTap(it, kind);
                    box.appendChild(b);
                }
            };
            fill("shop-avatars", SHOP_AVATARS, "avatar");
            fill("shop-themes", SHOP_THEMES, "theme");
        }

        function shopTap(it, kind) {
            const msg = document.getElementById("shop-msg");
            const use = () => { if (kind === "avatar") shop.avatar = shop.avatar === it.id ? null : it.id; else shop.theme = it.id; };
            if (shop.owned.includes(it.id)) {   // already mine: switch to it (tapping the character in use takes it off)
                shopConfirm = null;
                use(); saveShop(); applyShop();
                msg.textContent = "";
            } else if (grandTotal < it.price) {
                shopConfirm = null;
                msg.style.color = "#c05621";
                msg.textContent = `חסרות עוד ${it.price - grandTotal} נקודות ל${it.name} – המשיכו לשחק! 💪`;
            } else if (shopConfirm !== it.id) {   // first tap: ask
                shopConfirm = it.id;
                msg.style.color = "#c05621";
                msg.textContent = `לקנות ${it.name} ב-${it.price} נקודות? לחצו שוב לאישור`;
            } else {   // second tap: buy and use it
                shopConfirm = null;
                grandTotal -= it.price;
                try { localStorage.setItem(TOTAL_KEY, String(grandTotal)); } catch (e) {}
                shop.owned.push(it.id);
                use(); saveShop(); applyShop(); showGrandTotal();
                msg.style.color = "#2f855a";
                msg.textContent = `🎉 קניתם ${it.name}!`;
                playUnlockSound();
            }
            renderShop();
        }
        applyShop();

        showGrandTotal();
        document.getElementById("words-input").value = readList(mode);
        applyModeUI();
        renderWords();

        // ---- Reopen where we left off: the shown screen (and a quiz in progress, a learning card, the summary)
        // is saved on the device at every change, so closing the app and opening it again comes back to the same place.
        function saveSession(screen) {
            const s = { screen };
            if (screen === "game" || screen === "summary") {
                const pos = w => fullWords.indexOf(w);
                const pending = nextQuestionTimer !== null;   // a right answer was just given: save as on the next question
                Object.assign(s, {
                    full: fullWords, sub: wordsData === fullWords ? null : wordsData.map(pos), missed: missed.map(pos),
                    i: currentIndex + (pending ? 1 : 0), score: totalScore, firstTry: correctFirstTryCount,
                    q: pending ? null : { answers: currentAnswers, wrong: wrongPicks },
                    step: stepQuiz ? { level: stepQuiz.level, index: stepQuiz.index } : null
                });
                // the summary is saved as it is shown: showing it again would add its points to the total a second time
                if (screen === "summary") s.html = document.getElementById("summary-screen").innerHTML;
            } else if ((screen === "learn" || screen === "learn-done") && learn) s.learn = { level: learn.level, index: learn.index, i: learn.i };
            try { localStorage.setItem("englishquiz-session", JSON.stringify(s)); } catch (e) {}
        }

        async function restoreSession() {
            let s = null;
            try { s = JSON.parse(localStorage.getItem("englishquiz-session")); } catch (e) {}
            if (!s || !s.screen || s.screen === "start") return;
            try {
                if (s.screen === "shop") return openShop();
                const lv = (s.step || s.learn || {}).level;
                const steps = lv ? learnSteps(await loadLevel(lv)) : null;   // the learning path's steps (needs the word bank)
                if (getComputedStyle(document.getElementById("start-screen")).display === "none") return;   // the user already moved on
                const hide = () => document.getElementById("start-screen").style.display = "none";
                if (s.screen === "learn" || s.screen === "learn-done") {
                    const step = steps && steps[s.learn.index];
                    if (!step) return;
                    learn = { level: lv, index: s.learn.index, steps, step, i: Math.max(0, Math.min(step.words.length - 1, s.learn.i || 0)) };
                    hide();
                    if (s.screen === "learn") { document.getElementById("learn-screen").style.display = "flex"; showCard(); }
                    else finishLearning();
                    return;
                }
                if ((s.screen !== "game" && s.screen !== "summary") || !Array.isArray(s.full) || !s.full.length) return;
                fullWords = s.full;
                wordsData = Array.isArray(s.sub) ? s.sub.map(k => fullWords[k]).filter(Boolean) : fullWords;
                if (!wordsData.length) wordsData = fullWords;
                missed = (s.missed || []).map(k => fullWords[k]).filter(Boolean);
                currentIndex = Math.max(0, Math.min(wordsData.length, s.i || 0));
                totalScore = s.score || 0;
                correctFirstTryCount = s.firstTry || 0;
                stepQuiz = null;
                if (s.step && steps && steps[s.step.index]) {
                    stepQuiz = { level: lv, index: s.step.index, steps };
                    learn = { level: lv, index: s.step.index, steps, step: steps[s.step.index], i: 0 };
                }
                hide();
                document.getElementById("score").innerText = totalScore;
                if (s.screen === "summary" && s.html) {
                    const sum = document.getElementById("summary-screen");
                    sum.innerHTML = s.html;
                    sum.style.display = "block";
                    return;
                }
                document.getElementById("game-screen").style.display = "block";
                loadQuestion(s.q);
            } catch (e) {}   // e.g. the word bank can't be loaded offline: stay on the start screen
        }

        // The phone's back button: an extra history entry (the "trap") catches it. A pop-up closes; in a quiz it
        // asks before leaving (like the leave button); other screens go back to the start screen.
        // The trap is there only while it is needed - on another screen than the start screen, or with a pop-up
        // open - so on the start screen back leaves the app at the first press. It is added when the user taps
        // into another screen: Chrome's back button skips history entries a page adds before the user touched
        // it, so an entry added at page load would let back close the app.
        history.replaceState({ eq: 0 }, "");
        let backTrap = false, skipPops = 0;
        const shownEl = id => getComputedStyle(document.getElementById(id)).display !== "none";
        function updateBackTrap() {
            const need = !shownEl("start-screen") || !!document.querySelector("[data-dialog]");
            if (need && !backTrap) { backTrap = true; history.pushState({ eq: 1 }, ""); }
            else if (!need && backTrap) { backTrap = false; skipPops++; history.back(); }   // remove the unused trap
        }
        window.addEventListener("popstate", () => {
            if (skipPops) { skipPops--; return; }   // our own history.back() above
            backTrap = false;                        // the back button used the trap up
            const dialog = [...document.querySelectorAll("[data-dialog]")].pop();
            if (dialog) dialog.click();              // a click on the dark background cancels it
            else if (shownEl("game-screen")) leaveGame();
            else if (!shownEl("start-screen")) showStart();
            updateBackTrap();                        // still needed (e.g. the "leave the quiz?" pop-up): set it again
        });
        // any screen change or pop-up updates the trap
        const trapWatch = new MutationObserver(updateBackTrap);
        trapWatch.observe(document.body, { childList: true });
        for (const id of ["start-screen", "game-screen", "summary-screen", "learn-screen", "learn-done-screen", "shop-screen"])
            trapWatch.observe(document.getElementById(id), { attributes: true, attributeFilter: ["style"] });
        restoreSession();
    </script>
</body>
</html>
