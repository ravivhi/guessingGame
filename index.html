<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/guessingGame/">
    <link rel="canonical" href="https://ravivh.com/guessingGame/">
    <title>משחק הניחושים</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #4a00e0;
            font-family: sans-serif;
            color: #fff;
        }
        a { color: #fff; }
    </style>
</head>
<body>
    <p>מעביר למשחק... אם לא הועברת אוטומטית <a href="/guessingGame/">לחץ כאן</a>.</p>
    <script>
        (function () {
            var target = '/guessingGame/';
            var cleanup = Promise.resolve();
            if ('serviceWorker' in navigator) {
                cleanup = navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                }).catch(function () {});
            }
            if (window.caches) {
                cleanup = cleanup.then(function () {
                    return caches.keys().then(function (keys) {
                        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    });
                }).catch(function () {});
            }
            cleanup.then(function () {
                location.replace(target);
            }).catch(function () {
                location.replace(target);
            });
        })();
    </script>
</body>
</html>
